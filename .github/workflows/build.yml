name: Хаб — проверка и сборка

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Chromium, ядро, rclone, окна Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Playwright и Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Сквозные тесты оболочки
        run: npm test

      - name: Библиотеки Tauri для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev xvfb dbus-x11
          # WebDriver для WebKitGTK: в Ubuntu 26.04 пакет переименован
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          if ! command -v WebKitWebDriver >/dev/null; then
            found=$(dpkg -L webkitgtk-webdriver webkit2gtk-driver 2>/dev/null | grep -m1 '/WebKitWebDriver$' || true)
            [ -n "$found" ] && sudo ln -sf "$found" /usr/local/bin/WebKitWebDriver
          fi
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rclone (с проверкой SHA-256)
        run: node scripts/fetch-rclone.mjs x86_64-unknown-linux-gnu

      - name: Этап 0 — поведение rclone
        run: tools/rclone-check/check.sh src-tauri/binaries/rclone-x86_64-unknown-linux-gnu

      - name: Тесты ядра (шифрование, хранилище, синхронизация с настоящим rclone)
        run: |
          node scripts/build-ui.mjs
          cd src-tauri && HUB_RCLONE=$PWD/binaries/rclone-x86_64-unknown-linux-gnu cargo test

      - name: Два окна Tauri через WebDriver
        run: |
          cargo install tauri-driver --locked
          (cd src-tauri && cargo build)
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 1
          DISPLAY=:99 HUB_RCLONE=$PWD/src-tauri/binaries/rclone-x86_64-unknown-linux-gnu node tests/tauri-e2e.mjs

      - name: Снимки экранов из тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/*.png
          retention-days: 7

  windows:
    name: Установщик для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm ci

      - name: rclone.exe (с проверкой SHA-256)
        run: node scripts/fetch-rclone.mjs x86_64-pc-windows-msvc

      - name: Сборка
        run: npx tauri build

      - name: Установщик
        uses: actions/upload-artifact@v4
        with:
          name: hub-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

  android:
    name: APK для Android
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # по умолчанию действие ставит пакет «tools», которого в репозитории Google больше нет
          packages: platform-tools

      - name: NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Зависимости
        run: npm ci

      - name: Проект Android
        run: |
          npx tauri icon src-tauri/icons/source.png
          npx tauri android init --ci

      - name: rclone для Android (из исходников, NDK)
        run: scripts/build-rclone-android.sh src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Доработка проекта
        run: node scripts/patch-android.mjs

      - name: Сборка
        run: npx tauri android build --apk --target aarch64

      - name: Ключ подписи (постоянный, из кэша)
        uses: actions/cache@v4
        with:
          path: ~/.hub-keystore
          key: hub-android-keystore-v1

      - name: Подпись
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "собран: $APK"
          scripts/sign-apk.sh "$APK" "Хаб.apk"

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: hub-android
          path: Хаб.apk
          retention-days: 30
