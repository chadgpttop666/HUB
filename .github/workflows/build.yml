name: Хаб — проверка и сборка

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Chromium + ядро)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Playwright и Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Сквозные тесты оболочки
        run: npm test

      - name: Снимки экранов из тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/*.png
          retention-days: 7

      - name: Библиотеки Tauri для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Тесты ядра
        run: |
          node scripts/build-ui.mjs
          cd src-tauri && cargo test

  windows:
    name: Установщик для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm ci

      - name: Сборка
        run: npx tauri build

      - name: Установщик
        uses: actions/upload-artifact@v4
        with:
          name: hub-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
