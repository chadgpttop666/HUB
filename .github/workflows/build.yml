name: Хаб — проверка и сборка

on:
  push:
    branches: [main, claude/jolly-cannon-rqlv03]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Chromium, ядро, rclone, окна Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Playwright и Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Согласованность версии
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json"));
          const version = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          if (config.version !== version) throw new Error("Версии Tauri и Cargo различаются");
          if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error("Номер тега отличается от версии приложения");
          }
          JS

      - name: APP_SPEC.md свежий
        run: node scripts/app-spec.mjs --check

      - name: Сквозные тесты оболочки
        run: npm test

      - name: Библиотеки Tauri для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev xvfb dbus-x11
          # WebDriver для WebKitGTK: в Ubuntu 26.04 пакет переименован
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          if ! command -v WebKitWebDriver >/dev/null; then
            found=$(dpkg -L webkitgtk-webdriver webkit2gtk-driver 2>/dev/null | grep -m1 '/WebKitWebDriver$' || true)
            [ -n "$found" ] && sudo ln -sf "$found" /usr/local/bin/WebKitWebDriver
          fi
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rclone (с проверкой SHA-256)
        run: node scripts/fetch-rclone.mjs x86_64-unknown-linux-gnu

      - name: Этап 0 — поведение rclone
        run: tools/rclone-check/check.sh src-tauri/binaries/rclone-x86_64-unknown-linux-gnu

      - name: Тесты ядра (шифрование, хранилище, синхронизация с настоящим rclone)
        run: |
          node scripts/build-ui.mjs
          cd src-tauri && HUB_RCLONE=$PWD/binaries/rclone-x86_64-unknown-linux-gnu cargo test

      - name: Два окна Tauri через WebDriver
        run: |
          cargo install tauri-driver --locked
          (cd src-tauri && cargo build)
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 1
          DISPLAY=:99 HUB_RCLONE=$PWD/src-tauri/binaries/rclone-x86_64-unknown-linux-gnu node tests/tauri-e2e.mjs

      - name: Снимки экранов из тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/*.png
          retention-days: 7

  windows:
    name: Установщик для Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm ci

      - name: rclone.exe (с проверкой SHA-256)
        run: node scripts/fetch-rclone.mjs x86_64-pc-windows-msvc

      - name: Сборка
        run: npx tauri build

      - name: Тихое обновление поверх 0.1.7
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'Hub-0.1.7-setup.exe'
          Invoke-WebRequest 'https://github.com/chadgpttop666/HUB/releases/download/v0.1.7/Hub-0.1.7-windows-x64-setup.exe' -OutFile $base
          if ((Get-FileHash $base).Hash -ne '82BB64994D4340BFB751BB2E166AB29E982FD526ED3D17B63910A8BC1C34D71E') {
            throw 'Не совпал SHA-256 предыдущего установщика'
          }
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Hub-update-test'
          $executable = Join-Path $destination 'hub.exe'
          function Run-Installer($path, $arguments) {
            $process = Start-Process -FilePath $path -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(90000)) { $process.Kill(); throw "Таймаут установщика $path" }
            if ($process.ExitCode -ne 0) { throw "Код выхода установщика $($process.ExitCode)" }
          }
          function Installed-Version {
            $version = (Get-Item -LiteralPath $executable).VersionInfo
            return '{0}.{1}.{2}' -f $version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart
          }
          Run-Installer $base "/S /D=$destination"
          if ((Installed-Version) -ne '0.1.7') { throw 'Исходная версия не установилась' }
          $data = Join-Path $env:APPDATA 'local.hub.desktop'
          New-Item -ItemType Directory -Force $data | Out-Null
          $marker = Join-Path $data 'update-test.txt'
          Set-Content -Path $marker -Value 'keep'
          Run-Installer $setup '/S /UPDATE /R'
          $expected = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installed = Installed-Version
          if ($installed -ne $expected) { throw "В каталоге установки версия $installed вместо $expected" }
          if ((Get-Content -Raw $marker).Trim() -ne 'keep') { throw 'Данные пользователя потеряны' }
          for ($i = 0; $i -lt 40; $i++) {
            if (Get-Process hub -ErrorAction SilentlyContinue | Where-Object Path -eq $executable) { exit 0 }
            Start-Sleep -Milliseconds 500
          }
          throw 'Хаб не открылся после обновления'

      - name: Установщик
        uses: actions/upload-artifact@v4
        with:
          name: hub-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  android:
    name: APK для Android
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # по умолчанию действие ставит пакет «tools», которого в репозитории Google больше нет
          packages: platform-tools

      - name: NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Зависимости
        run: npm ci

      - name: Проект Android
        run: |
          npx tauri icon src-tauri/icons/source.png
          npx tauri android init --ci

      - name: rclone для Android (из исходников, NDK)
        run: scripts/build-rclone-android.sh src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Доработка проекта
        run: node scripts/patch-android.mjs

      - name: Сборка
        run: npx tauri android build --apk --target aarch64

      - name: Ключ подписи (постоянный, из кэша)
        uses: actions/cache@v4
        with:
          path: ~/.hub-keystore
          key: hub-android-keystore-v1

      - name: Подпись
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: 3a11e27832b41b74f597ec6957ca1ff984e672faf80542620eda7c2c9b697470
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "собран: $APK"
          scripts/sign-apk.sh "$APK" "Hub.apk"

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: hub-android
          path: Hub.apk
          retention-days: 30


  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hub-windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: hub-android
          path: android

      - name: Имена файлов релиза
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          mv windows/*-setup.exe "release/Hub-$version-windows-x64-setup.exe"
          mv android/*.apk "release/Hub-$version-android-arm64.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
