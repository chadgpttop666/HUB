<!-- @dsCard group="Окна и сообщения" height=330 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Диалог</title>
<link rel="stylesheet" href="../../preview/kit.css">

</head>
<body>
<div class="hub-backdrop" data-scene="open"><div class="hub-backdrop__photo"></div><div class="hub-backdrop__veil"></div></div>
<div class="pv" style="gap:var(--space-6);align-items:center;justify-content:center;min-height:330px">
  <div class="hub-dialog" role="dialog" aria-modal="true" aria-labelledby="d1" style="margin:0">
    <h2 class="hub-dialog__title" id="d1">Удалить приложение «Чтение»?</h2>
    <p class="hub-dialog__body">Его данные останутся в архиве на Google Drive ещё 30 дней, карточка исчезнет с «Сегодня».</p>
    <div class="hub-dialog__actions"><button class="hub-btn hub-btn--quiet" type="button">Отмена</button><button class="hub-btn hub-btn--danger" type="button"><i data-icon="trash-2"></i>Удалить</button></div>
  </div>
  <div class="hub-dialog" role="dialog" aria-modal="true" aria-labelledby="d2" style="margin:0;width:380px">
    <h2 class="hub-dialog__title" id="d2">Новая тема повторения</h2>
    <label class="hub-field" style="margin-top:var(--space-4)"><span class="hub-label">Название</span><input class="hub-input pv-focus" value="Политология"></label>
    <div class="hub-dialog__actions"><button class="hub-btn hub-btn--quiet" type="button">Отмена</button><button class="hub-btn hub-btn--primary" type="button">Создать <kbd class="hub-kbd">Enter</kbd></button></div>
  </div>
</div>
<script>
(function () {
  if (!document.querySelector('link[href*="preview/kit.css"]')) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '../../preview/kit.css'; document.head.appendChild(l);
  }
  if (window.HubUI) HubUI.init();

})();
</script>
</body>
</html>
