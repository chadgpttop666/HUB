<!-- @dsCard group="Данные" height=330 subtitle="Для учебных блоков и повторения: идёт, пауза, закончен" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таймер</title>
<link rel="stylesheet" href="../../preview/kit.css">

</head>
<body>
<div class="hub-backdrop" data-scene="open"><div class="hub-backdrop__photo"></div><div class="hub-backdrop__veil"></div></div>
<div class="pv" style="gap:var(--space-8);align-items:center">
<div class="pv-col" style="justify-items:center"><div class="hub-timer" data-state="running" style="--p:0.35" role="timer" aria-label="Осталось 16 минут 12 секунд"><svg class="hub-timer__ring" viewBox="0 0 100 100"><circle class="hub-timer__track" cx="50" cy="50" r="48"/><circle class="hub-timer__value" cx="50" cy="50" r="48" pathLength="100"/></svg><div class="hub-timer__inner"><div class="hub-timer__time">16:12</div><div class="hub-timer__label">блок 2 из 4 · идёт</div></div></div>
  <div class="hub-timer-controls"><button class="hub-btn hub-btn--primary" type="button"><i data-icon="pause"></i>Пауза <kbd class="hub-kbd">Пробел</kbd></button><button class="hub-btn hub-btn--quiet hub-btn--icon" type="button" aria-label="Сбросить"><i data-icon="rotate-ccw"></i></button></div></div>
<div class="pv-col" style="justify-items:center"><div class="hub-timer" data-state="paused" style="--p:0.6"><svg class="hub-timer__ring" viewBox="0 0 100 100"><circle class="hub-timer__track" cx="50" cy="50" r="48"/><circle class="hub-timer__value" cx="50" cy="50" r="48" pathLength="100"/></svg><div class="hub-timer__inner"><div class="hub-timer__time">10:00</div><div class="hub-timer__label">пауза</div></div></div>
  <div class="hub-timer-controls"><button class="hub-btn hub-btn--primary" type="button"><i data-icon="play"></i>Продолжить</button></div></div>
<div class="pv-col" style="justify-items:center"><div class="hub-timer" data-state="done" style="--p:1"><svg class="hub-timer__ring" viewBox="0 0 100 100"><circle class="hub-timer__track" cx="50" cy="50" r="48"/><circle class="hub-timer__value" cx="50" cy="50" r="48" pathLength="100"/></svg><div class="hub-timer__inner"><div class="hub-timer__time">00:00</div><div class="hub-timer__label">блок закончен</div></div></div>
  <div class="hub-timer-controls"><button class="hub-btn" type="button">Перерыв 5 минут</button></div></div>
<div class="pv-col" style="justify-items:center"><div class="hub-timer hub-timer--sm" data-state="running" style="--p:0.8"><svg class="hub-timer__ring" viewBox="0 0 100 100"><circle class="hub-timer__track" cx="50" cy="50" r="47"/><circle class="hub-timer__value" cx="50" cy="50" r="47" pathLength="100"/></svg><div class="hub-timer__inner"><div class="hub-timer__time">04:51</div></div></div><span class="pv-cap">маленький — в боковой колонке</span></div>
</div>
<script>
(function () {
  if (!document.querySelector('link[href*="preview/kit.css"]')) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '../../preview/kit.css'; document.head.appendChild(l);
  }
  if (window.HubUI) HubUI.init();

})();
</script>
</body>
</html>
