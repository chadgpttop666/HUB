<script>
(function () {
  if (!document.querySelector('link[href*="preview/kit.css"]')) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '../../preview/kit.css'; document.head.appendChild(l);
  }
  if (window.HubUI) HubUI.init();
  var tpls = document.querySelectorAll('template[data-note]');
  var host = document.getElementById('pvScreen'), note = document.getElementById('pvNote');
  var btns = document.querySelectorAll('.pv-states [data-i]');
  function show(i) {
    host.innerHTML = tpls[i].innerHTML; note.textContent = tpls[i].getAttribute('data-note');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.i) === i)); });
    HubUI.init(host);
    if (window.pvAfter) window.pvAfter(host, i);
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { show(Number(b.dataset.i)); }); });

  show(0);

})();
</script>
