<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь</title>
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<div class="calendar">
  <header class="calendar-head">
    <h1 class="hub-page-title">Календарь</h1>
    <div class="calendar-actions">
      <button class="hub-btn hub-btn--sm" type="button" id="today-btn">Сегодня</button>
      <button class="hub-btn hub-btn--sm" type="button" id="import-btn"><i data-icon="download"></i>Импорт</button>
      <button class="hub-btn hub-btn--primary hub-btn--icon hub-btn--sm" type="button" id="add-btn" aria-label="Добавить событие"><i data-icon="plus"></i></button>
    </div>
  </header>
  <div class="calendar-toolbar">
    <div class="week-nav">
      <button class="hub-btn hub-btn--quiet hub-btn--icon hub-btn--sm" type="button" id="prev" aria-label="Предыдущая неделя"><i data-icon="chevron-left"></i></button>
      <span id="week-title"></span>
      <button class="hub-btn hub-btn--quiet hub-btn--icon hub-btn--sm" type="button" id="next" aria-label="Следующая неделя"><i data-icon="chevron-right"></i></button>
    </div>
    <div class="hub-segmented" aria-label="Вид календаря">
      <button type="button" data-view="day">День</button>
      <button type="button" data-view="week">Неделя</button>
    </div>
  </div>
  <section id="day-view" hidden>
    <div id="day-picker" class="day-picker" aria-label="Дни недели"></div>
    <h2 class="day-heading" id="day-title"></h2>
    <ul id="day-list" class="timeline"></ul>
    <p id="day-empty" class="hub-muted" hidden>Событий нет.</p>
  </section>
  <section id="week-view" class="week-scroll" aria-label="Неделя по часам" hidden></section>
  <section id="undated-box" hidden>
    <h2 class="hub-section-title">Без даты</h2>
    <ul id="undated" class="hub-list timeline"></ul>
  </section>
</div>

<dialog class="hub-dialog calendar-dialog" id="event-dialog" aria-labelledby="event-title">
  <form id="event-form">
    <h2 class="hub-dialog__title" id="event-title">Событие</h2>
    <label class="hub-field"><span class="hub-label">Название</span><input class="hub-input" name="title" required maxlength="180"></label>
    <div class="form-fields">
      <label class="hub-field"><span class="hub-label">Дата</span><input class="hub-input" name="date" type="date"></label>
      <label class="hub-field"><span class="hub-label">Категория</span><select class="hub-input" name="category"><option value="personal">Личное</option><option value="study">Учёба</option><option value="work">Работа</option></select></label>
      <label class="hub-field"><span class="hub-label">Начало</span><input class="hub-input" name="time" type="time"></label>
      <label class="hub-field"><span class="hub-label">Окончание</span><input class="hub-input" name="endTime" type="time"></label>
      <label class="hub-field"><span class="hub-label">Напоминание</span><select class="hub-input" name="reminder"><option value="">Выключено</option><option value="silent">Тихое</option><option value="normal">Обычное</option><option value="alarm">Будильник</option></select></label>
      <label class="hub-field"><span class="hub-label">За сколько минут</span><input class="hub-input" name="minutes" type="number" min="0" max="10080" value="0" required></label>
    </div>
    <p id="reminder-status" class="hub-hint" role="status"></p>
    <button class="hub-btn hub-btn--sm" id="reminder-permission" type="button" hidden>Разрешить напоминания на этом устройстве</button>
    <label class="hub-field"><span class="hub-label">Заметка</span><textarea class="hub-textarea" name="note" rows="2" maxlength="4000"></textarea></label>
    <p class="hub-hint hub-hint--error" id="event-error" role="alert"></p>
    <div class="hub-dialog__actions">
      <button class="hub-btn hub-btn--danger" id="event-delete" type="button" hidden>Удалить</button>
      <button class="hub-btn hub-btn--quiet" type="button" data-close>Отмена</button>
      <button class="hub-btn hub-btn--primary" type="submit">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog class="hub-dialog calendar-dialog import-dialog" id="import-dialog" aria-labelledby="import-title">
  <h2 class="hub-dialog__title" id="import-title">Импорт расписания</h2>
  <p class="hub-dialog__body">Скопируйте запрос, приложите расписания и допишите свои дела в чате с нейросетью. Вставьте её ответ сюда.</p>
  <p class="hub-hint" id="import-zone"></p>
  <details id="import-context"><summary>Добавить в запрос текущую неделю и записи из Корзины</summary><div id="import-context-list"></div></details>
  <button type="button" class="hub-btn hub-btn--sm" id="copy-prompt"><i data-icon="copy"></i>Скопировать промпт</button>
  <textarea class="hub-textarea" id="prompt-text" aria-label="Промпт" rows="6" readonly hidden></textarea>
  <label class="hub-field"><span class="hub-label">Ответ нейросети</span><textarea class="hub-textarea" id="import-text" rows="5" placeholder="Вставьте сюда ответ целиком"></textarea></label>
  <div class="import-buttons">
    <label class="hub-btn hub-btn--sm import-file">Загрузить файл<input id="import-file" type="file" accept=".json,.txt,application/json,text/plain"></label>
    <button class="hub-btn hub-btn--sm" type="button" id="import-preview">Предпросмотр</button>
  </div>
  <div id="import-results"></div>
  <p class="hub-hint" id="import-status" aria-live="polite"></p>
  <button class="hub-btn hub-btn--sm" id="import-permission" type="button" hidden>Разрешить напоминания на этом устройстве</button>
  <div class="hub-dialog__actions">
    <button class="hub-btn hub-btn--sm" type="button" id="import-undo" hidden>Отменить последний импорт</button>
    <button class="hub-btn hub-btn--quiet" type="button" data-close>Закрыть</button>
    <button class="hub-btn hub-btn--primary" type="button" id="import-apply" disabled>Добавить выбранное</button>
  </div>
</dialog>
<script src="model.js"></script>
<script src="calendar.js"></script>
</body>
</html>
