<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Теории и повторение</title>
<style>
  /* Внутри Хаба: цвета, шрифт и стекло берёт из темы хаба (tokens.css, hub.css подключает сам хаб).
     Свои имена переменных оставлены, чтобы не трогать остальные стили, но значения — только токены. */
  :root {
    --card: var(--surface);
    --ink: var(--text);
    --muted: var(--text-muted);
    --def: var(--accent);
    --warn: var(--warning);
    --warn-soft: var(--warning-soft);
    --sunken: var(--surface-sunken);
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: transparent; color: var(--ink); font-family: var(--font-body); min-height: 100vh; padding: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  h1 { font-family: var(--font-heading); font-size: 28px; font-weight: 300; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .stats b { color: var(--accent); }
  .head-actions { display: flex; gap: 4px; align-items: center; }

  button { font-family: inherit; cursor: pointer; border: none; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { border-radius: 999px; font-weight: 700; font-size: 14px; padding: 10px 22px;
         transition: opacity .15s, background .15s; }
  .btn:hover { opacity: .9; }
  .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-outline:hover { background: var(--surface-hover); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--ink); opacity: 1; }
  .btn-sm { font-size: 12px; padding: 6px 12px; font-weight: 600; }
  .btn.on { background: var(--accent-soft); color: var(--accent); }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { border-radius: 999px; font-weight: 700; font-size: 14px; padding: 9px 20px;
         background: transparent; color: var(--muted); border: 1px solid var(--line-soft); }
  .tab:hover { color: var(--ink); border-color: var(--line); }
  .tab.active { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
  .tab .badge { margin-left: 4px; }

  .seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line-soft);
         border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .seg button { border-radius: 999px; font-size: 13px; font-weight: 700; padding: 7px 16px;
                background: transparent; color: var(--muted); }
  .seg button.active { background: var(--accent); color: var(--on-accent); }

  .section-title { display: flex; align-items: center; gap: 8px; font-weight: 800;
                   margin: 24px 0 12px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
           background: var(--sunken); color: var(--muted); }
  .badge.on { background: var(--accent); color: var(--on-accent); }
  .hint { font-size: 11px; font-weight: 400; color: var(--muted); }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
          margin-bottom: 12px; border: 1px solid var(--line-soft); }
  .card.due { border-color: var(--accent); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-title { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
  .link-title { background: none; padding: 0; font-size: 18px; font-weight: 800; color: var(--ink);
                text-align: left; border-bottom: 2px solid transparent; }
  .link-title:hover { border-bottom-color: var(--accent-soft); }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
          background: var(--accent-soft); color: var(--accent); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.grey { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
  .pill.dash { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .icon-btn { width: 30px; height: 30px; border-radius: 999px; background: transparent;
              color: var(--muted); font-size: 14px; flex-shrink: 0; }
  .icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
  .card-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .grades { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
         background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }

  .qrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
          border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--muted); }
  .qrow:first-of-type { border-top: none; }
  .qrow b { color: var(--ink); font-weight: 700; }

  /* сессия */
  .sess-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sess-name { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; }
  .prog { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .prog > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
  .prog-label { font-size: 12px; color: var(--muted); }
  .q-card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 28px 24px; box-shadow: var(--shadow);
            margin-top: 14px; min-height: 220px; display: flex; flex-direction: column; }
  .q-text { font-size: 21px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
  .q-ans { margin-top: 18px; padding: 14px 16px; background: var(--accent-soft); border-radius: 14px;
           font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .q-ans.none { background: var(--sunken); color: var(--muted); }
  .q-actions { margin-top: auto; padding-top: 22px; display: flex; gap: 10px; }
  .g-btn { flex: 1; border-radius: 16px; padding: 16px 8px; font-size: 16px; font-weight: 800;
           display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .1s; }
  .g-btn:hover { transform: translateY(-1px); }
  .g-btn small { font-size: 11px; font-weight: 600; opacity: .8; }
  .g-fail { background: var(--danger-soft); color: var(--danger); }
  .g-ok { background: var(--accent); color: var(--on-accent); }
  .reveal { width: 100%; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 800;
            background: var(--accent); color: var(--on-accent); }
  .reveal small { font-weight: 600; opacity: .7; margin-left: 6px; font-size: 12px; }
  .keys { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }
  .sum-big { font-size: 22px; font-weight: 800; }
  .fail-item { border-top: 1px solid var(--line-soft); padding: 14px 0; }
  .fail-item:first-of-type { border-top: none; }
  .fail-q { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; }
  .fail-a { margin-top: 8px; padding: 10px 14px; background: var(--accent-soft); border-radius: 12px;
            font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* база и страница записи */
  .base-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
  .base-row + .base-row { border-top: 1px solid var(--line-soft); }
  .base-list { padding: 4px 0; }
  .base-row .grow { flex: 1; min-width: 0; }
  .rec-title { font-size: 26px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .lead { font-size: 16px; color: var(--ink); margin-top: 10px; line-height: 1.5; }
  details.alias { display: inline-block; margin-left: 6px; font-size: 13px; color: var(--muted); vertical-align: middle; }
  details.alias > summary { cursor: pointer; list-style: none; display: inline; }
  details.alias > summary::-webkit-details-marker { display: none; }
  .fields { margin-top: 12px; font-size: 14px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
  .fields .k { color: var(--muted); }
  .md { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
  .md h3 { font-size: 17px; font-weight: 800; margin: 20px 0 6px; }
  .md h4 { font-size: 15px; font-weight: 800; margin: 16px 0 4px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); margin: 8px 0; }
  .md code { background: var(--sunken); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .md a { color: var(--accent); }
  .def { color: var(--def); font-weight: 800; }
  .wl { border-bottom: 1.5px dashed var(--accent); cursor: pointer; border-radius: 2px; }
  .wl:hover, .wl:focus-visible { background: var(--accent-soft); border-bottom-style: solid; outline: none; }
  .wl.dead { border-bottom-color: var(--text-faint); color: var(--muted); }
  .maybe { border-bottom: 1px dotted var(--muted); cursor: help; }
  .tip { position: fixed; z-index: 70; max-width: 380px; background: var(--surface-strong); border: 1px solid var(--line);
         border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-float); font-size: 13px;
         line-height: 1.5; pointer-events: none; }
  .tip-src { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .tip-item + .tip-item { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .tip-foot { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .flash { animation: flash 1.9s ease; border-radius: 6px; }
  @keyframes flash { 0%, 45% { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
  details.ctx { display: block; margin: 4px 0 8px; }
  details.ctx > summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 13px; list-style: none; }
  details.ctx > summary::-webkit-details-marker { display: none; }
  details.ctx .md { margin-top: 6px; padding: 10px 14px; background: var(--sunken); border-radius: 12px; font-size: 14px; }
  .frag { margin-top: 10px; }
  .frag-src { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .frag .md { padding: 6px 12px; border-left: 3px solid var(--accent-soft); font-size: 14px; }
  .mentions { line-height: 1.9; }
  .links-block { margin-top: 8px; font-size: 14px; }
  .links-block div { margin: 4px 0; }
  .links-block .k { color: var(--muted); }

  .editor textarea { width: 100%; min-height: 460px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
                     font-size: 13px; line-height: 1.55; background: var(--sunken); color: var(--ink);
                     border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; resize: vertical; }
  .editor textarea:focus { border-color: var(--accent); }
  .ed-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .counter { font-size: 12px; color: var(--muted); }
  .counter.over { color: var(--danger); font-weight: 700; }
  .err { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--danger-soft);
         color: var(--danger); font-size: 13px; font-weight: 700; }

  .empty { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
           color: var(--muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  .empty-big { text-align: center; padding: 48px 16px; }
  .empty-big .t { font-size: 20px; font-weight: 800; margin-bottom: 6px; color: var(--ink); }
  .hidden { display: none !important; }

  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .statcard { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow); }
  .statcard .v { font-size: 22px; font-weight: 800; }
  .statcard .v small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .statcard .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-title { font-weight: 800; margin-bottom: 12px; }
  .hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .hmcell { width: 12px; height: 12px; border-radius: 3px; background: var(--sunken); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 40px));
           background: var(--surface-strong); color: var(--ink); border: 1px solid var(--line-soft); border-radius: var(--radius-pill); padding: 10px 18px; font-size: 13px;
           display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-float);
           max-width: calc(100% - 32px); z-index: 50; opacity: 0; visibility: hidden; pointer-events: none;
           transition: transform .25s ease, opacity .2s ease, visibility 0s linear .25s; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible;
                transition: transform .25s ease, opacity .2s ease, visibility 0s; }
  .modal { position: fixed; inset: 0; background: var(--scrim-mid); -webkit-backdrop-filter: blur(var(--blur-overlay)); backdrop-filter: blur(var(--blur-overlay)); z-index: 60;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--surface-strong); border: 1px solid var(--line-soft); border-radius: var(--radius-xl); padding: 22px; max-width: 440px; width: 100%;
               box-shadow: var(--shadow-float); }
  .modal-text { font-size: 15px; margin-bottom: 18px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }


  /* база: сетка карточек */
  .wrap { transition: max-width .15s; }
  body.wide .wrap { max-width: 1000px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--sunken);
           border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; outline: none; cursor: pointer; }
  select:focus-visible { border-color: var(--accent); outline: 2px solid var(--focus); }
  option { background: var(--surface-strong); color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border-radius: 999px; font-size: 13px; font-weight: 700; padding: 6px 14px; background: transparent;
          color: var(--ink); border: 1px solid var(--line-soft); }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip .cn { opacity: .6; font-weight: 600; margin-left: 5px; }
  .chips.clamp { overflow: hidden; }
  .topic-tools { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .topic-tools input { font-family: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 999px;
                       padding: 6px 14px; background: var(--card); color: var(--ink); outline: none; min-width: 200px; }
  .topic-tools input:focus { border-color: var(--accent); }
  .person-head { display: flex; gap: 22px; align-items: flex-start; }
  .person-head .ph-main { flex: 1; min-width: 0; }
  .photo-box { position: relative; flex: none; width: 136px; height: 136px; border-radius: 16px; overflow: hidden;
               background: var(--sunken); border: 1px solid var(--line); cursor: pointer; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .photo-box.empty { border: 1.5px dashed var(--text-faint); display: flex; align-items: center; justify-content: center;
                     text-align: center; color: var(--muted); font-size: 12px; line-height: 1.35; padding: 10px; }
  .photo-box.empty b { display: block; font-size: 26px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .photo-box.empty:hover, .photo-box.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .photo-acts { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; justify-content: center;
                padding: 6px; background: var(--scrim-mid); opacity: 0; transition: opacity .12s; }
  .photo-box:hover .photo-acts, .photo-box:focus-within .photo-acts { opacity: 1; }
  .photo-acts button { font: inherit; font-size: 11px; font-weight: 700; border: none; border-radius: 999px;
                       padding: 3px 9px; background: var(--surface-strong); color: var(--ink); cursor: pointer; }
  .ava { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; flex: none;
         vertical-align: middle; border: 1px solid var(--line); }
  .sr-name .ava { margin-right: 8px; margin-top: -3px; }
  .tip-ava { float: left; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: 50% 22%;
             margin: 2px 10px 4px 0; border: 1px solid var(--line); }
  .tip-person::after { content: ""; display: block; clear: both; }
  .drop-ov { position: fixed; inset: 0; z-index: 90; background: var(--scrim-mid); display: flex;
             align-items: center; justify-content: center; pointer-events: none; padding: 16px; }
  .drop-ov.hidden { display: none; }
  .drop-msg { background: var(--surface-strong); border: 2px dashed var(--accent); border-radius: 22px; padding: 26px 34px;
              font-size: 17px; font-weight: 800; text-align: center; max-width: 460px; box-shadow: var(--shadow-float); }
  .drop-msg .hint { font-weight: 500; font-size: 13px; margin-top: 6px; }
  @media (max-width: 560px) { .person-head { flex-direction: column; } }
  .divider { border-top: 1px solid var(--line-soft); opacity: .85; margin: 16px 0 18px; }
  .mat-note { margin-top: 10px; }
  .rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rcard { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px;
           cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 128px;
           transition: background .12s, border-color .12s; }
  .rcard:hover, .rcard:focus-visible { background: var(--accent-soft); border-color: var(--accent); outline: none; }
  .rcard:hover .pill, .rcard:focus-visible .pill { background: var(--surface-strong); }
  .rcard.heard { border-style: dashed; border-color: var(--line); }
  .rc-title { font-weight: 800; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
  .rc-by { font-size: 13px; color: var(--muted); }
  .rc-kr { font-size: 13px; color: var(--text-muted); line-height: 1.45; margin-top: 4px; overflow: hidden;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rc-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rc-topic { font-size: 12px; color: var(--muted); font-weight: 700; }
  @media (max-width: 720px) { .rgrid { grid-template-columns: 1fr; } }
  .ec-head { display: flex; gap: 12px; align-items: center; }
  .ec-head .ava { width: 46px; height: 46px; }
  .ava-ph { width: 46px; height: 46px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
            background: var(--sunken); border: 1px solid var(--line); color: var(--muted); font-weight: 800; font-size: 15px; }

  /* панель ввода */
  .add-panel { border-color: var(--accent); }
  .add-panel input[type="text"], .add-panel textarea { width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; resize: vertical; }
  .add-panel textarea.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 13px; line-height: 1.5; }
  .add-panel input:focus, .add-panel textarea:focus { border-color: var(--accent); }
  .add-hint { font-size: 13px; color: var(--warn); margin-top: 6px; min-height: 18px; }
  .lp { margin-top: 12px; border-top: 1px solid var(--line-soft); }
  .lp-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft);
            font-size: 14px; flex-wrap: wrap; }
  .lp-row label { cursor: pointer; }
  .lp-note { font-size: 12px; color: var(--muted); }
  .lp-row input { accent-color: var(--accent); }

  /* страницы */
  .page-bar { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
  .lnk { background: none; padding: 0; font: inherit; color: var(--accent); font-weight: 700;
         border-bottom: 1px dashed var(--accent); }
  .lnk:hover { border-bottom-style: solid; }
  .tag-btn { cursor: pointer; font-family: inherit; }
  .tag-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* поиск */
  .search-row { margin-bottom: 14px; }
  .search { width: 100%; font-family: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
            border: 1px solid var(--line-soft); border-radius: 999px; padding: 11px 20px; outline: none; box-shadow: var(--shadow); }
  .search:focus { border-color: var(--accent); }
  .sr-list { padding: 4px 0; }

<script>
"use strict";
// =====================================================================
//  Теории и повторение — версия 2, этап 1 (ядро повторения)
//  Один файл, без сервера. Данные — в localStorage браузера.
// =====================================================================

// ---------- даты ----------
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// новый день начинается в 4:00: занятия после полуночи относятся ко вчерашнему дню
const DAY_START_H = 4;
const todayISO = () => isoOf(new Date(Date.now() - DAY_START_H * 3600e3));
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoOf(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const daysUntil = iso => daysBetween(todayISO(), iso);
const fmt = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
const fmtShort = iso => { const [, m, d] = iso.split("-"); return `${d}.${m}`; };
const EPOCH = "1970-01-01";
const dayNum = iso => daysBetween(EPOCH, iso);
const isoFromNum = n => addDays(EPOCH, n);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const pct = x => Math.round(x * 100);

// ---------- FSRS-6 ----------
// Параметры по умолчанию и формулы — из эталонной реализации open-spaced-repetition (py-fsrs).
// Оценок две: 1 — «не помню» (Again), 3 — «помню» (Good).
const FSRS_W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666,
  0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const FSRS_DEFAULT = FSRS_W.slice();
let DECAY = -FSRS_W[20];
let FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
// свои параметры после подгонки по журналу: 21 число; null — стандартные
function applyFsrsParams(w) {
  const src = Array.isArray(w) && w.length === 21 && w.every(x => typeof x === "number" && isFinite(x)) ? w : FSRS_DEFAULT;
  FSRS_W.splice(0, 21, ...src);
  DECAY = -FSRS_W[20];
  FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  return src !== FSRS_DEFAULT;
}
const MAX_IVL = 36500;
const clampD = d => Math.min(10, Math.max(1, d));
const clampS = s => Math.max(0.001, s);

// вероятность вспомнить через t дней при стабильности s
const retr = (t, s) => Math.pow(1 + FACTOR * Math.max(0, t) / s, DECAY);
// интервал, через который вероятность опустится до цели r
const intervalDays = (s, r) =>
  Math.min(MAX_IVL, Math.max(1, Math.round(s / FACTOR * (Math.pow(r, 1 / DECAY) - 1))));
const initS = g => clampS(FSRS_W[g - 1]);
const initD = (g, clamp = true) => { const d = FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1; return clamp ? clampD(d) : d; };
function nextD(d, g) {
  const target = initD(4, false);
  const delta = -FSRS_W[6] * (g - 3);
  const damped = d + (10 - d) * delta / 9;
  return clampD(FSRS_W[7] * target + (1 - FSRS_W[7]) * damped);
}
const recallS = (d, s, r) =>
  s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) * (Math.exp((1 - r) * FSRS_W[10]) - 1));
function forgetS(d, s, r) {
  const longTerm = FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp((1 - r) * FSRS_W[14]);
  const shortTerm = s / Math.exp(FSRS_W[17] * FSRS_W[18]);
  return Math.min(longTerm, shortTerm);
}
// новое состояние вопроса после ответа (сам вопрос не меняется)
function fsrsReview(q, ok, t, retention) {
  const g = ok ? 3 : 1;
  let s, d;
  if (q.s == null) { s = initS(g); d = initD(g); }
  else {
    const r = retr(daysBetween(q.last, t), q.s);
    s = clampS(ok ? recallS(q.d, q.s, r) : forgetS(q.d, q.s, r));
    d = nextD(q.d, g);
  }
  const iv = intervalDays(s, retention);
  return { s, d, last: t, due: addDays(t, iv), reps: (q.reps || 0) + 1, lapses: (q.lapses || 0) + (ok ? 0 : 1), iv };
}
const qR = (q, day) => q.s == null ? 0 : retr(daysBetween(q.last, day), q.s);

// ---------- хранилище ----------
const KEYS = { records: "tb-records", people: "tb-people", schools: "tb-schools", log: "tb-log", meta: "tb-meta", plan: "tb-plan" };
const OLD = { items: "spaced-repetition-items", mats: "spaced-repetition-materials", stats: "spaced-repetition-stats" };
const DISCIPLINES = ["философия", "социология", "политология", "экономика", "право", "другое"];
const RET_MIN = 0.7, RET_MAX = 0.97;

function freshMeta() {
  return { version: 2, legacyByDay: {}, created: todayISO(),
           settings: { retention: 0.9, mode: "topics", disciplines: DISCIPLINES.slice(), kratkoLimit: 150, hardLapses: 3, matchThreshold: 0.8, fsrsW: null } };
}
let db = { records: [], people: [], schools: [], log: [], meta: freshMeta(), plan: null };

function readKey(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
let dbVersion = 0;
function saveDB() {
  dbVersion++;
  try {
    for (const k of Object.keys(KEYS)) localStorage.setItem(KEYS[k], JSON.stringify(db[k]));
    return true;
  } catch (e) {
    toast("Не удалось сохранить: в хранилище браузера кончилось место. Сделай экспорт.");
    return false;
  }
}
function fixRecord(r) {
  return {
    id: r.id || uid(), title: r.title || "Без названия", aliases: r.aliases || [], authors: r.authors || [],
    schools: r.schools || [], disciplines: r.disciplines || [], topics: r.topics || [],
    links: Object.assign({ response: "", conflicts: "", confuse: "" }, r.links || {}),
    body: r.body || "", retention: r.retention || null,
    questions: (r.questions || []).map(fixQuestion),
    created: r.created || todayISO(), updated: r.updated || r.created || todayISO(), snooze: r.snooze || null,
    inbox: !!r.inbox,   // материал из прежней версии, отложенный «на потом»
  };
}
function fixQuestion(q) {
  return { id: q.id || uid(), q: q.q || "", a: q.a || "", ref: q.ref || "",
           s: q.s == null ? null : q.s, d: q.d == null ? null : q.d, last: q.last || null,
           due: q.due || todayISO(), reps: q.reps || 0, lapses: q.lapses || 0,
           bad: !!q.bad, later: !!q.later, created: q.created || todayISO() };
}
function setDB(parts) {
  const meta = Object.assign(freshMeta(), parts.meta || {});
  meta.settings = Object.assign(freshMeta().settings, (parts.meta && parts.meta.settings) || {});
  dbVersion++;
  db = { records: (parts.records || []).map(fixRecord), people: (parts.people || []).map(fixPerson),
         schools: (parts.schools || []).map(fixSchool), log: parts.log || [], meta, plan: fixPlan(parts.plan) };
  applyFsrsParams(meta.settings.fsrsW);
}
// загрузка: новая база → иначе перенос из прежней версии → иначе пусто
function loadDB() {
  const meta = readKey(KEYS.meta);
  if (meta && meta.version === 2) {
    setDB({ records: readKey(KEYS.records) || [], people: readKey(KEYS.people) || [],
            schools: readKey(KEYS.schools) || [], log: readKey(KEYS.log) || [], meta, plan: readKey(KEYS.plan) });
    if (!db.meta.inboxMarked) {
      const n = markOldMaterials(readKey(OLD.mats));
      db.meta.inboxMarked = true; saveDB();
      if (n) return `Материалы из прежней версии (${n}) отложены в стадию «Материалы» — в «Базе» они по умолчанию скрыты.`;
    }
    return null;
  }
  const items = readKey(OLD.items), mats = readKey(OLD.mats), stats = readKey(OLD.stats);
  if ((Array.isArray(items) && items.length) || (Array.isArray(mats) && mats.length)) {
    setDB(migrateOld({ items: items || [], mats: mats || [], stats }));
    saveDB();   // старые ключи не трогаем — они остаются резервной копией
    return `Данные прежней версии перенесены: записей — ${db.records.length}. Старые данные сохранены в браузере как резервная копия.`;
  }
  setDB({});
  return null;
}

// база перенесена до появления стадии «Материалы»: находим бывшие материалы по резервной копии.
// Без неё: при переносе каждая карточка получала хотя бы один вопрос, поэтому перенесённая запись
// без вопросов — это бывший материал; её выдаёт дата создания раньше дня переноса или строка «Источник: …»
function markOldMaterials(mats) {
  let n = 0;
  const cand = db.records.filter(r => !r.questions.length && !r.inbox);
  if (Array.isArray(mats) && mats.length) {
    const titles = new Set();
    for (const m of mats) if (!m.repId) { titles.add(norm(m.title || "")); titles.add(norm(oldTitleBody(m.title || ""))); }
    for (const r of cand) if (titles.has(norm(r.title))) { r.inbox = true; n++; }
  } else
    for (const r of cand) if (/(^|\n)Источник: \[/.test(r.body) || (db.meta.created && r.created < db.meta.created)) { r.inbox = true; n++; }
  return n;
}
// ---------- дневник плана: описание данных ----------
// дела настраиваются; у каждого тип: check — галочка, minutes — минуты, blocks — минуты блоками, choice — вариант
const PLAN_DEFAULT_ACTS = [
  { id: "balcony", name: "Прогулка", type: "check" },
  { id: "cards", name: "Карточки", type: "minutes", auto: "cards", step: 10 },
  { id: "blocks", name: "Учебные блоки", type: "blocks", blockMin: 50 },
  { id: "sport", name: "Спорт", type: "choice", options: ["A", "L", "A1", "A2", "O"], rest: "O" },
];
function fixPlan(p) {
  p = p || {};
  return {
    // «Балкон» переименован в «Прогулку»; id прежний, отметки прошлых дней сохраняются
    acts: Array.isArray(p.acts) && p.acts.length ? p.acts.map(a => a.id === "balcony" && a.name === "Балкон" ? Object.assign({}, a, { name: "Прогулка" }) : a) : PLAN_DEFAULT_ACTS.map(a => Object.assign({}, a, a.options ? { options: a.options.slice() } : {})),
    days: p.days || {},          // дата → { id дела: значение }; у засекаемого дела здесь только ручная поправка
    timed: p.timed || {},        // дата → секунды, засечённые в сессиях повторения
    sessions: p.sessions || {},  // дата → число сессий
    start: p.start || null,      // дата «дня 1» для нумерации
    seeded: !!p.seeded,
    // награды за время ответов: balance — сколько можно потратить, progress — секунды к следующей
    rewards: Object.assign({ balance: 0, progress: 0, earned: 0, spent: 0, log: [] }, p.rewards || {}),
    timer: p.timer || null,                                              // идущий таймер: блок или повторения
    timerSettings: Object.assign({ block: 50, rep: 10 }, p.timerSettings || {}),
    distractions: p.distractions || {},                                  // дата → { n, sec } уходов со вкладки
  };
}
// ---------- перенос из прежней версии ----------
const OLD_BASE = [1, 3, 7, 14, 30, 60, 120];
const NO_TAG = null;
function oldTagOf(title) {
  const i = title.indexOf(".");
  if (i === -1) return NO_TAG;
  const head = title.slice(0, i).trim();
  if (head.length < 3 || head.length > 30 || head.split(/\s+/).length > 2) return NO_TAG;
  return head;
}
function oldTitleBody(title) {
  const t = oldTagOf(title);
  return t === NO_TAG ? title : (title.slice(title.indexOf(".") + 1).trim() || title);
}
function migrateOld({ items, mats, stats }) {
  const t = todayISO();
  const records = [];
  const byItem = new Map(items.map(it => [it.id, it]));
  const usedItems = new Set();
  const disc = DISCIPLINES;

  // префикс до точки: дисциплина из списка — в дисциплины; длинный префикс — в темы;
  // короткий (до 4 букв, например «Соц.») — это сокращение, название не трогаем
  const placeTag = (rec, rawTitle) => {
    const tag = oldTagOf(rawTitle);
    rec.title = rawTitle;
    if (!tag) return;
    if (disc.includes(norm(tag))) { rec.disciplines.push(norm(tag)); rec.title = oldTitleBody(rawTitle); }
    else if (tag.length >= 5) { rec.topics.push(norm(tag)); rec.title = oldTitleBody(rawTitle); }
  };
  const questionsFrom = it => {
    const last = it.lastReview || it.learned || t;
    const next = it.nextReview || addDays(last, 1);
    const s = Math.max(1, daysBetween(last, next));   // при цели 90% интервал = стабильности
    const qs = Array.isArray(it.questions) ? it.questions : [];
    const mk = (q, a) => fixQuestion({ q, a, s, d: 5, last, due: next, reps: 1, created: it.learned || last });
    if (qs.length) return qs.map(x => mk(x.q, x.a || ""));
    const sq = mk("Вспомни конспект целиком", "");
    sq._fill = true;   // ответ подставим, когда станет известен конспект
    return [sq];
  };

  for (const m of mats) {
    const rec = fixRecord({ created: m.added || t });
    placeTag(rec, m.title || "Без названия");
    let body = "";
    if (m.summary) body += "## Суть\n\n" + m.summary.trim() + "\n";
    if (m.url) body += (body ? "\n" : "") + `Источник: [${m.url}](${m.url})\n`;
    rec.body = body;
    const it = m.repId && byItem.get(m.repId);
    if (it) {
      usedItems.add(it.id);
      rec.questions = questionsFrom(it);
      rec.created = it.learned || rec.created;
    } else rec.inbox = true;   // не было в повторении — в отдельную стадию «Материалы»
    records.push(rec);
  }
  for (const it of items) {
    if (usedItems.has(it.id)) continue;
    const rec = fixRecord({ created: it.learned || t });
    placeTag(rec, it.title || "Без названия");
    rec.questions = questionsFrom(it);
    records.push(rec);
  }
  // служебный вопрос: ответом служит конспект
  for (const r of records)
    for (const q of r.questions) if (q._fill) { q.a = summaryOf(r) || "Сверься со своими записями."; delete q._fill; }

  const meta = freshMeta();
  if (stats && stats.byDay) meta.legacyByDay = Object.assign({}, stats.byDay);
  return { records, people: [], schools: [], log: [], meta };
}
function summaryOf(r) {
  const m = r.body.match(/##\s*Суть\s*\n([\s\S]*?)(\n##\s|$)/i);
  return m ? m[1].trim() : r.body.trim();
}

// ---------- запись: вычисляемые свойства ----------
const retentionOf = r => r.retention || db.meta.settings.retention;
const activeQs = r => r.questions.filter(q => !q.bad);
// конспект — это текст; пустые заголовки заготовки и строка «Источник: …» конспектом не считаются
const hasNotes = body => String(body).split("\n").some(l => { const x = l.trim(); return x && !/^#{1,6}\s/.test(x) && !/^источник:/i.test(x); });
function stageOf(r) {
  if (r.inbox && !r.questions.length) return "materials";
  if (r.questions.length) return "rep";
  if (hasNotes(r.body)) return "notes";
  return "heard";
}
function meanR(r, day) {
  const qs = activeQs(r);
  if (!qs.length) return null;
  return qs.reduce((a, q) => a + qR(q, day), 0) / qs.length;
}
const snoozed = (r, t) => r.snooze && r.snooze > t;
const hasNew = r => activeQs(r).some(q => q.s == null);
// режим «По темам»: тема созрела, если есть новые вопросы или средняя вероятность ниже цели
// «ниже цели» включает равенство: в день, когда стабильность истекает ровно, тема уже созрела
const belowTarget = (m, ret) => m <= ret + 1e-9;
function topicDue(r, t) {
  const m = meanR(r, t);
  if (m == null || snoozed(r, t)) return false;
  return hasNew(r) || belowTarget(m, retentionOf(r));
}
// день, когда тема созреет (средняя вероятность монотонно убывает — двоичный поиск)
function topicMatureDate(r, t) {
  const start = snoozed(r, t) ? r.snooze : t;
  if (hasNew(r)) return start;
  const ret = retentionOf(r);
  if (belowTarget(meanR(r, start), ret)) return start;
  let lo = 0, hi = MAX_IVL;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (belowTarget(meanR(r, addDays(start, mid)), ret)) hi = mid; else lo = mid + 1; }
  return addDays(start, lo);
}
// режим «По вопросам»
const qDue = (q, t) => q.s == null || q.due <= t;
function dueQs(r, t) { return snoozed(r, t) ? [] : activeQs(r).filter(q => qDue(q, t)); }
function nextQDate(r, t) {
  const qs = activeQs(r);
  if (!qs.length) return null;
  const d = qs.map(q => q.s == null ? t : q.due).sort()[0];
  return snoozed(r, t) && d < r.snooze ? r.snooze : d;
}

// ---------- теоретики и школы (этап 1: заготовки по имени) ----------
function resolveNames(names, coll) {
  return names.map(name => {
    const n = norm(name);
    let e = coll.find(x => norm(x.name) === n || (x.aliases || []).some(a => norm(a) === n));
    if (!e) { e = (coll === db.schools ? fixSchool : fixPerson)({ name: name.trim() }); coll.push(e); }
    return e.id;
  });
}
const namesOf = (ids, coll) => ids.map(id => (coll.find(x => x.id === id) || {}).name).filter(Boolean);

// ---------- единый текстовый формат записи ----------
const FIELDS = [
  ["синонимы", "aliases"], ["авторы", "authors"], ["школа", "schools"], ["дисциплины", "disciplines"],
  ["темы", "topics"], ["в ответ на", "response"], ["конфликтует с", "conflicts"], ["не путать с", "confuse"], ["цель", "retention"],
];
const FIELD_ALIASES = { "автор": "authors", "школы": "schools", "дисциплина": "disciplines", "тема": "topics",
                        "синоним": "aliases", "цель запоминания": "retention" };
const fieldKey = k => { const n = norm(k); const f = FIELDS.find(x => x[0] === n); return f ? f[1] : FIELD_ALIASES[n] || null; };
const TEMPLATE_BODY = "## Кратко\n\n\n## Контекст\n\n\n## Суть\n\n\n## Критика\n\n";

function serializeRecord(r) {
  const val = {
    aliases: r.aliases.join(", "), authors: namesOf(r.authors, db.people).join(", "),
    schools: namesOf(r.schools, db.schools).join(", "), disciplines: r.disciplines.join(", "),
    topics: r.topics.join(", "), response: r.links.response, conflicts: r.links.conflicts, confuse: r.links.confuse,
    retention: pct(retentionOf(r)) + "%",
  };
  const head = FIELDS.map(([name, key]) => `${name}: ${val[key] || ""}`.trimEnd()).join("\n");
  const qs = r.questions.map(q => q.q + (q.a ? " :: " + q.a.replace(/\n/g, " ") : "") + (q.ref ? " -> " + q.ref : "")).join("\n");
  return `# ${r.title}\n${head}\n---\n${r.body.replace(/\s+$/, "")}\n\n## Вопросы\n${qs}\n`;
}
function newRecordText() {
  return `# \n${FIELDS.map(([n, k]) => k === "retention" ? `${n}: ${pct(db.meta.settings.retention)}%` : `${n}:`).join("\n")}\n---\n${TEMPLATE_BODY}## Вопросы\n`;
}
const splitList = v => v.split(/[,;]/).map(s => s.trim()).filter(Boolean);

// разбор текста в данные; ошибка — с номером строки
function parseRecord(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const fail = (i, msg) => ({ error: { line: i + 1, msg } });
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (i >= lines.length) return fail(0, "Запись пустая. Первая строка — «# Название».");
  const tm = lines[i].match(/^#(?!#)\s*(.*)$/);
  if (!tm) return fail(i, "Первая строка должна начинаться с «# » и содержать название.");
  const title = tm[1].trim();
  if (!title) return fail(i, "После «#» нужно название записи.");
  i++;
  const data = { title, aliases: [], authors: [], schools: [], disciplines: [], topics: [],
                 links: { response: "", conflicts: "", confuse: "" }, retention: null, body: "", questions: [] };
  let sep = -1;
  for (let k = i; k < lines.length; k++) if (/^-{3,}\s*$/.test(lines[k])) { sep = k; break; }
  const headEnd = sep === -1 ? lines.length : sep;
  for (let k = i; k < headEnd; k++) {
    const ln = lines[k];
    if (!ln.trim()) continue;
    const m = ln.match(/^([^:]+):\s*(.*)$/);
    const key = m && fieldKey(m[1]);
    if (!key) {
      if (sep === -1) return fail(k, "Не найдена черта «---» между полями и конспектом.");
      return fail(k, m ? `Неизвестное поле «${m[1].trim()}».` : "Ожидается строка вида «поле: значение».");
    }
    const v = m[2].trim();
    if (key === "retention") {
      if (!v) continue;
      const n = parseFloat(v.replace(",", ".").replace("%", ""));
      const r = n > 1 ? n / 100 : n;
      if (!isFinite(r) || r < RET_MIN || r > RET_MAX) return fail(k, "Цель — число от 70 до 97 (процентов).");
      data.retention = Math.round(r * 100) / 100;
    } else if (["response", "conflicts", "confuse"].includes(key)) data.links[key] = v;
    else if (key === "disciplines" || key === "topics") data[key] = splitList(v).map(norm);
    else data[key] = splitList(v);
  }
  if (sep === -1) return { data };
  // тело и вопросы
  let qStart = -1;
  for (let k = sep + 1; k < lines.length; k++) if (/^##\s*вопросы\s*$/i.test(lines[k].trim())) { qStart = k; break; }
  const bodyLines = lines.slice(sep + 1, qStart === -1 ? lines.length : qStart);
  data.body = bodyLines.join("\n").replace(/^\n+/, "").replace(/\s+$/, "");
  if (qStart !== -1) {
    for (let k = qStart + 1; k < lines.length; k++) {
      let ln = lines[k].trim();
      if (!ln) continue;
      ln = ln.replace(/^[-*]\s+/, "");
      let q = ln, a = "", ref = "";
      const si = ln.indexOf("::");
      if (si !== -1) { q = ln.slice(0, si).trim(); a = ln.slice(si + 2).trim(); }
      const tgt = si !== -1 ? a : q;
      const ri = Math.max(tgt.lastIndexOf("->"), tgt.lastIndexOf("→"));
      if (ri !== -1) {
        const len = tgt.startsWith("->", ri) ? 2 : 1;
        ref = tgt.slice(ri + len).trim();
        if (si !== -1) a = tgt.slice(0, ri).trim(); else q = tgt.slice(0, ri).trim();
      }
      if (!q) return fail(k, "Пустой вопрос: перед «::» должен стоять текст вопроса.");
      data.questions.push({ q, a, ref });
    }
  }
  return { data };
}

// раздел «Кратко»: текст до следующего заголовка
function kratkoOf(body) {
  const m = String(body).match(/(^|\n)##\s*Кратко\s*\n([\s\S]*?)(?=\n##\s|$)/i);
  return m ? m[2].trim() : "";
}
const bodyWithoutKratko = body => String(body).replace(/(^|\n)##\s*Кратко\s*\n[\s\S]*?(?=\n##\s|$)/i, "$1").replace(/^\s+/, "");

// ---------- сопоставление вопросов при правке ----------
function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const similarity = (a, b) => { const m = Math.max(a.length, b.length); return m ? 1 - lev(a, b) / m : 1; };
// возвращает новый список вопросов (прогресс сохранён где можно) и удалённые вопросы с прогрессом
function mergeQuestions(oldQs, parsedQs, threshold) {
  const used = new Set(), map = [];
  parsedQs.forEach((p, i) => {
    const j = oldQs.findIndex((o, k) => !used.has(k) && norm(o.q) === norm(p.q));
    if (j !== -1) { used.add(j); map[i] = { j, exact: true }; }
  });
  parsedQs.forEach((p, i) => {
    if (map[i]) return;
    let best = -1, bs = 0;
    oldQs.forEach((o, k) => { if (used.has(k)) return; const s = similarity(norm(o.q), norm(p.q)); if (s > bs) { bs = s; best = k; } });
    if (best !== -1 && bs >= threshold) { used.add(best); map[i] = { j: best, exact: false }; }
  });
  const t = todayISO();
  const questions = parsedQs.map((p, i) => {
    if (!map[i]) return fixQuestion({ q: p.q, a: p.a, ref: p.ref, due: t, created: t });
    const o = oldQs[map[i].j];
    const textChanged = o.q !== p.q;
    return Object.assign({}, o, { q: p.q, a: p.a, ref: p.ref, bad: textChanged ? false : o.bad });
  });
  const removed = oldQs.filter((o, k) => !used.has(k) && o.reps > 0);
  return { questions, removed };
}

// ---------- журнал ----------
// строка журнала: [номер дня, id вопроса, 1 — помню / 0 — нет, 1 — повтор в тот же день (состояние не менялось)]
const logCountByDay = () => {
  const m = {};
  for (const [d] of db.log) { const iso = isoFromNum(d); m[iso] = (m[iso] || 0) + 1; }
  for (const [iso, n] of Object.entries(db.meta.legacyByDay || {})) m[iso] = (m[iso] || 0) + n;
  return m;
};

// ---------- стеммер Snowball для русского ----------
// Отрезает окончания по алгоритму Snowball (snowballstem.org): «моральной паники» → «морал паник».
const RU_STEM = (() => {
  const V = "аеиоуыэюя";
  const PERF_1 = ["вшись", "вши", "в"], PERF_2 = ["ывшись", "ившись", "ывши", "ивши", "ыв", "ив"];
  const REFL = ["ся", "сь"];
  const ADJ = ["ими", "ыми", "его", "ого", "ему", "ому", "ее", "ие", "ые", "ое", "ей", "ий", "ый", "ой", "ем", "им", "ым", "ом",
               "их", "ых", "ую", "юю", "ая", "яя", "ою", "ею"];
  const PART_1 = ["ем", "нн", "вш", "ющ", "щ"], PART_2 = ["ивш", "ывш", "ующ"];
  const VERB_1 = ["ете", "йте", "ешь", "нно", "ла", "на", "ли", "ем", "ло", "но", "ет", "ют", "ны", "ть", "й", "л", "н"];
  const VERB_2 = ["ейте", "уйте", "ила", "ыла", "ена", "ите", "или", "ыли", "ило", "ыло", "ено", "ует", "уют", "ены", "ить", "ыть",
                  "ишь", "ей", "уй", "ил", "ыл", "им", "ым", "ен", "ят", "ит", "ыт", "ую", "ю"];
  const NOUN = ["иями", "ями", "ами", "ией", "иям", "ием", "иях", "ев", "ов", "ие", "ье", "еи", "ии", "ей", "ой", "ий", "ям", "ем",
                "ам", "ом", "ах", "ях", "ию", "ью", "ия", "ья", "а", "е", "и", "й", "о", "у", "ы", "ь", "ю", "я"];
  const SUPER = ["ейше", "ейш"], DERIV = ["ость", "ост"];
  const byLen = a => a.slice().sort((x, y) => y.length - x.length);
  [PERF_1, PERF_2, REFL, ADJ, PART_1, PART_2, VERB_1, VERB_2, NOUN, SUPER, DERIV].forEach(a => a.splice(0, a.length, ...byLen(a)));
  const isV = c => V.includes(c);
  // самое длинное окончание из списка, целиком лежащее в области [from..]; group1 — только после «а» или «я»
  function find(w, list, from, group1) {
    for (const e of list) {
      if (!w.endsWith(e)) continue;
      const at = w.length - e.length;
      if (at < from) continue;
      if (group1) { const p = w[at - 1]; if (at - 1 < from || (p !== "а" && p !== "я")) continue; }
      return e;
    }
    return null;
  }
  // окончание из двух групп: выбираем более длинное совпадение
  function find2(w, g1, g2, from) {
    const a = find(w, g1, from, true), b = find(w, g2, from, false);
    if (a && b) return a.length >= b.length ? a : b;
    return a || b;
  }
  const cut = (w, e) => w.slice(0, w.length - e.length);
  return function stem(word) {
    let w = word.toLowerCase().replace(/ё/g, "е");
    if (!/^[а-я]+$/.test(w)) return w;
    // RV — после первой гласной; R1 — после первой согласной, идущей за гласной; R2 — то же внутри R1
    let rv = w.length;
    for (let i = 0; i < w.length; i++) if (isV(w[i])) { rv = i + 1; break; }
    const rAfter = start => { for (let i = start; i < w.length - 1; i++) if (isV(w[i]) && !isV(w[i + 1])) return i + 2; return w.length; };
    const r1 = rAfter(0), r2 = rAfter(r1);
    // шаг 1
    let e = find2(w, PERF_1, PERF_2, rv);
    if (e) w = cut(w, e);
    else {
      e = find(w, REFL, rv, false);
      if (e) w = cut(w, e);
      e = find(w, ADJ, rv, false);
      if (e) {
        w = cut(w, e);
        const p = find2(w, PART_1, PART_2, rv);
        if (p) w = cut(w, p);
      } else {
        e = find2(w, VERB_1, VERB_2, rv);
        if (e) w = cut(w, e);
        else { e = find(w, NOUN, rv, false); if (e) w = cut(w, e); }
      }
    }
    // шаг 2
    if (w.endsWith("и") && w.length - 1 >= rv) w = w.slice(0, -1);
    // шаг 3
    e = find(w, DERIV, r2, false);
    if (e) w = cut(w, e);
    // шаг 4
    if (w.endsWith("нн") && w.length - 2 >= rv) w = w.slice(0, -1);
    else {
      e = find(w, SUPER, rv, false);
      if (e) { w = cut(w, e); if (w.endsWith("нн") && w.length - 2 >= rv) w = w.slice(0, -1); }
      else if (w.endsWith("ь") && w.length - 1 >= rv) w = w.slice(0, -1);
    }
    return w;
  };
})();

// ---------- теоретики и школы ----------
function fixPerson(p) {
  return { id: p.id || uid(), name: (p.name || "Без имени").trim(), aliases: p.aliases || [], years: p.years || "",
           schools: p.schools || [], body: p.body || "", updated: p.updated || todayISO() };
}
function fixSchool(x) {
  return { id: x.id || uid(), name: (x.name || "Без названия").trim(), aliases: x.aliases || [],
           conflicts: (x.conflicts || []).map(c => ({ raw: c.raw || "", target: c.target || null })),
           body: x.body || "", updated: x.updated || todayISO() };
}
const person = id => db.people.find(p => p.id === id);
const school = id => db.schools.find(x => x.id === id);
const variantsOf = e => [e.name, ...(e.aliases || [])];
const findByName = (coll, name, exceptId) =>
  coll.find(e => e.id !== exceptId && variantsOf(e).some(v => norm(v) === norm(name)));

// похожее имя: опечатка, неполное имя («Грановеттер» и «Марк Грановеттер»), совпавшая фамилия
function similarEntity(name, coll, exceptId) {
  const n = norm(name), toks = n.split(" ");
  let best = null, bs = 0;
  for (const e of coll) {
    if (e.id === exceptId) continue;
    for (const v of variantsOf(e)) {
      const m = norm(v);
      if (!m) continue;
      const mt = m.split(" ");
      let sc = similarity(n, m);
      if (toks.every(t => mt.includes(t)) || mt.every(t => toks.includes(t))) sc = Math.max(sc, 0.9);
      // фамилия: последнее слово варианта против любого слова ввода («Норт Д.», «Грановетер»).
      // Только для теоретиков: у школ последнее слово общее («… социология») и ничего не значит
      const sur = mt[mt.length - 1];
      if (coll === db.people && sur.length >= 4 && toks.some(t => t.length >= 4 && similarity(t, sur) >= 0.85)) sc = Math.max(sc, 0.85);
      if (sc > bs) { bs = sc; best = e; }
    }
  }
  return bs >= 0.8 ? best : null;
}
// основы слов: без последних 1–2 букв, чтобы «слабые» и «слабых» совпали; короткие слова не считаются
// служебные слова названий теорий в сравнении не участвуют: иначе любые две «теории …» окажутся похожими
const TITLE_STOP = /^(теори|концепц|модел|эффект|принцип|закон|парадокс|гипотез|школ|подход|феномен)/;
const wordKeys = s => norm(s).split(/[^a-zа-я0-9]+/).filter(w => w.length >= 4 && !TITLE_STOP.test(w)).map(w => w.slice(0, Math.max(4, w.length - 2)));
// общих основ хотя бы 2 и не меньше 60% от более короткого названия
function keysCover(a, b) {
  if (a.length < 2 || b.length < 2) return false;
  const shared = a.filter(k => b.some(x => x.startsWith(k) || k.startsWith(x))).length;
  return shared >= 2 && shared >= 0.6 * Math.min(a.length, b.length);
}
// похожая запись по названию и синонимам
function recordMatch(title, exceptId) {
  const n = norm(title);
  let exact = null, sim = null, bs = 0;
  for (const r of db.records) {
    if (r.id === exceptId) continue;
    for (const v of [r.title, ...r.aliases]) {
      const m = norm(v);
      if (m === n) exact = exact || r;
      let sc = similarity(n, m);
      if (n.length >= 6 && m.length >= 6 && (m.includes(n) || n.includes(m))) sc = Math.max(sc, 0.85);
      const kn = wordKeys(n), km = wordKeys(m);
      if (keysCover(kn, km)) sc = Math.max(sc, 0.82);
      if (sc > bs) { bs = sc; sim = r; }
    }
  }
  return { exact, similar: !exact && bs >= 0.8 ? sim : null };
}
// похожая тема: опечатка или общее начало слова («город» и «городская среда»)
const allTopics = () => [...new Set(db.records.flatMap(r => r.topics))].sort((a, b) => a.localeCompare(b, "ru"));
function similarTopic(t, list) {
  const n = norm(t);
  let best = null, bs = 0;
  for (const x of list) {
    if (x === n) return null;
    let sc = similarity(n, x);
    const xt = x.split(" "), nt = n.split(" ");
    if (n.length >= 4 && xt.some(w => w.startsWith(n) || n.startsWith(w) && w.length >= 4)) sc = Math.max(sc, 0.82);
    if (nt.length > 1 && nt.some(w => w.length >= 4 && x.startsWith(w))) sc = Math.max(sc, 0.82);
    // однословные темы с общим началом: «сеть» и «сети»
    if (nt.length === 1 && xt.length === 1) {
      let k = 0; while (k < n.length && k < x.length && n[k] === x[k]) k++;
      if (k >= Math.max(3, Math.min(n.length, x.length) - 2)) sc = Math.max(sc, 0.82);
    }
    if (sc > bs) { bs = sc; best = x; }
  }
  return bs >= 0.8 ? best : null;
}
// теоретик, чья фамилия встречается в строке (с учётом падежного окончания: «Норта», «Зиммеля»)
function authorInLine(line) {
  const toks = norm(line).split(/[^a-zа-я0-9-]+/).filter(Boolean);
  for (const p of db.people)
    for (const v of variantsOf(p)) {
      const sur = norm(v).split(" ").pop();
      if (sur.length < 4) continue;
      const stem = sur.length > 5 ? sur.slice(0, -1) : sur;
      if (toks.some(t => t.startsWith(stem) && t.length - sur.length <= 3)) return p;
    }
  return null;
}

// ---------- текстовый формат теоретика и школы ----------
const PERSON_FIELDS = [["варианты", "aliases"], ["годы", "years"], ["школы", "schools"]];
const SCHOOL_FIELDS = [["синонимы", "aliases"], ["конфликтует с", "conflicts"]];
const PERSON_TEMPLATE = "## Работы\n\n\n## Справка\n\n";
const SCHOOL_TEMPLATE = "## Справка\n\n";
const ENTITY_ALIASES = { "имена": "aliases", "имя": "aliases", "вариант": "aliases", "школа": "schools",
                         "синоним": "aliases", "конфликт": "conflicts", "конфликты": "conflicts" };

function serializePerson(p) {
  return `# ${p.name}\nварианты: ${p.aliases.join(", ")}\nгоды: ${p.years}\nшколы: ${namesOf(p.schools, db.schools).join(", ")}\n---\n${(p.body || PERSON_TEMPLATE).replace(/\s+$/, "")}\n`
    .replace(/: \n/g, ":\n");
}
function serializeSchool(x) {
  const conf = x.conflicts.length ? x.conflicts.map(c => `конфликтует с: ${c.raw}`).join("\n") : "конфликтует с:";
  return `# ${x.name}\nсинонимы: ${x.aliases.join(", ")}\n${conf}\n---\n${(x.body || SCHOOL_TEMPLATE).replace(/\s+$/, "")}\n`
    .replace(/: \n/g, ":\n");
}
// общий разбор: «# имя», поля до черты, тело после черты
function parseEntity(text, fields) {
  const lines = text.replace(/\r/g, "").split("\n");
  const fail = (i, msg) => ({ error: { line: i + 1, msg } });
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (i >= lines.length) return fail(0, "Текст пустой. Первая строка — «# Имя».");
  const tm = lines[i].match(/^#(?!#)\s*(.*)$/);
  if (!tm || !tm[1].trim()) return fail(i, "Первая строка должна быть «# » и имя.");
  const data = { name: tm[1].trim(), aliases: [], years: "", schools: [], conflicts: [], body: "" };
  let sep = -1;
  for (let k = i + 1; k < lines.length; k++) if (/^-{3,}\s*$/.test(lines[k])) { sep = k; break; }
  const end = sep === -1 ? lines.length : sep;
  for (let k = i + 1; k < end; k++) {
    const ln = lines[k];
    if (!ln.trim()) continue;
    const m = ln.match(/^([^:]+):\s*(.*)$/);
    const nk = m && norm(m[1]);
    const f = m && (fields.find(x => x[0] === nk) || (ENTITY_ALIASES[nk] && fields.find(x => x[1] === ENTITY_ALIASES[nk])));
    if (!f) {
      if (sep === -1) return fail(k, "Не найдена черта «---» между полями и текстом.");
      return fail(k, m ? `Неизвестное поле «${m[1].trim()}».` : "Ожидается строка вида «поле: значение».");
    }
    const v = m[2].trim();
    if (f[1] === "years") data.years = v;
    else if (f[1] === "conflicts") { if (v) data.conflicts.push(v); }
    else data[f[1]] = data[f[1]].concat(splitList(v));
  }
  if (sep !== -1) data.body = lines.slice(sep + 1).join("\n").replace(/^\n+/, "").replace(/\s+$/, "");
  return { data };
}
// у кого конфликт: имя из первой [[ссылки]], иначе текст до тире
function conflictTargetName(raw) {
  const m = raw.match(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/);
  if (m) return m[1].trim();
  return raw.split(/\s[—–-]\s/)[0].trim();
}
function conflictExplain(raw) {
  const parts = raw.split(/\s[—–-]\s/);
  return parts.length > 1 ? parts.slice(1).join(" — ").trim() : "";
}
// конфликты школы: свои и записанные у другой стороны
function conflictsOf(x) {
  const out = x.conflicts.map(c => ({ other: c.target, raw: c.raw, own: true }));
  for (const o of db.schools) {
    if (o.id === x.id) continue;
    for (const c of o.conflicts) if (c.target === x.id) out.push({ other: o.id, raw: c.raw, own: false });
  }
  return out;
}

// ---------- слияние дублей и удаление ----------
const uniq = a => [...new Set(a)];
function mergePeople(srcId, dstId) {
  const src = person(srcId), dst = person(dstId);
  if (!src || !dst || src === dst) return;
  for (const r of db.records) if (r.authors.includes(srcId)) r.authors = uniq(r.authors.map(id => id === srcId ? dstId : id));
  dst.aliases = uniq([...dst.aliases, ...variantsOf(src)].filter(v => norm(v) !== norm(dst.name)));
  dst.years = dst.years || src.years;
  dst.schools = uniq([...dst.schools, ...src.schools]);
  if (!hasNotes(dst.body) && hasNotes(src.body)) dst.body = src.body;
  if (photos.has(srcId) && !photos.has(dstId)) savePhoto(dstId, photos.get(srcId));
  dropPhoto(srcId);
  db.people = db.people.filter(p => p.id !== srcId);
}
function mergeSchools(srcId, dstId) {
  const src = school(srcId), dst = school(dstId);
  if (!src || !dst || src === dst) return;
  for (const r of db.records) if (r.schools.includes(srcId)) r.schools = uniq(r.schools.map(id => id === srcId ? dstId : id));
  for (const p of db.people) if (p.schools.includes(srcId)) p.schools = uniq(p.schools.map(id => id === srcId ? dstId : id));
  for (const o of db.schools) for (const c of o.conflicts) if (c.target === srcId) c.target = dstId;
  dst.aliases = uniq([...dst.aliases, ...variantsOf(src)].filter(v => norm(v) !== norm(dst.name)));
  dst.conflicts = [...dst.conflicts, ...src.conflicts.filter(c => c.target !== dstId)];
  if (!hasNotes(dst.body) && hasNotes(src.body)) dst.body = src.body;
  db.schools = db.schools.filter(x => x.id !== srcId);
}
function deletePerson(id) {
  dropPhoto(id);
  for (const r of db.records) r.authors = r.authors.filter(a => a !== id);
  db.people = db.people.filter(p => p.id !== id);
}
function deleteSchool(id) {
  for (const r of db.records) r.schools = r.schools.filter(a => a !== id);
  for (const p of db.people) p.schools = p.schools.filter(a => a !== id);
  for (const o of db.schools) o.conflicts = o.conflicts.map(c => c.target === id ? Object.assign({}, c, { target: null }) : c);
  db.schools = db.schools.filter(x => x.id !== id);

// текст без разметки — для карточек
const plainText = s => String(s).replace(/\[\[!?([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a)
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, "$1").replace(/\*\*|`/g, "").replace(/(^|\s)\*([^*]+)\*/g, "$1$2");

// пустые разделы заготовки (заголовок без текста) при показе не выводим
function dropEmptySections(body) {
  const lines = String(body).split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    if (/^#{1,6}\s/.test(lines[i].trim())) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length || /^#{1,6}\s/.test(lines[j].trim())) { i = j - 1; continue; }
    }
    out.push(lines[i]);
  }
  return out.join("\n");
}

// =====================================================================
//  Ссылки [[...]], определения [[!...]], обратные связи
// =====================================================================
const recById = id => db.records.find(r => r.id === id);
const LINK_RE = /\[\[(!?)([^\]|]+)(?:\|([^\]]+))?\]\]/g;
const targetsIn = text => [...String(text || "").matchAll(LINK_RE)].filter(m => !m[1]).map(m => m[2].trim());
// раздел конспекта по названию заголовка
function sectionOf(body, name) {
  const lines = String(body).split("\n"), n = norm(name);
  let i = lines.findIndex(l => { const m = l.match(/^#{1,6}\s+(.*)$/); return m && norm(m[1]) === n; });
  if (i === -1) return "";
  const out = [];
  for (let k = i + 1; k < lines.length; k++) { if (/^#{1,6}\s/.test(lines[k])) break; out.push(lines[k]); }
  return out.join("\n").trim();
}

// индекс строится один раз на версию базы
let _idx = null, _idxV = -1;
function linkIndex() {
  if (_idx && _idxV === dbVersion) return _idx;
  const defs = new Map(), titles = new Map(), people = new Map(), schools = new Map();
  const add = (m, k, v) => { k = norm(k); if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for (const r of db.records) {
    for (const v of [r.title, ...r.aliases]) add(titles, v, r);
    for (const line of r.body.split("\n"))
      for (const m of line.matchAll(LINK_RE)) if (m[1]) add(defs, m[2], { recId: r.id, term: m[2].trim(), line: line.trim() });
  }
  for (const p of db.people) for (const v of variantsOf(p)) add(people, v, p);
  for (const x of db.schools) for (const v of variantsOf(x)) add(schools, v, x);
  _idx = { defs, titles, people, schools, hintCache: new Map() };
  // кто на кого ссылается
  const mentions = new Map(), incoming = new Map();
  const bump = (m, key, field, recId) => {
    if (!m.has(key)) m.set(key, { response: new Set(), conflicts: new Set(), confuse: new Set(), any: new Set() });
    m.get(key)[field].add(recId);
  };
  _idxV = dbVersion;   // разрешение ниже уже пользуется индексом
  for (const r of db.records) {
    const texts = [r.body, r.links.response, r.links.conflicts, r.links.confuse];
    for (const t of texts.flatMap(targetsIn)) for (const key of resolvedKeys(t)) if (key !== "rec:" + r.id) bump(mentions, key, "any", r.id);
    for (const field of ["response", "conflicts", "confuse"])
      for (const t of targetsIn(r.links[field])) for (const key of resolvedKeys(t))
        if (key.startsWith("rec:") && key !== "rec:" + r.id) bump(incoming, key, field, r.id);
  }
  _idx.mentions = mentions; _idx.incoming = incoming;
  return _idx;
}
// подсказка «может, это термин?»: основы слов терминов, определённых в других записях; длинные — первыми
function hintReFor(selfId) {
  const ix = linkIndex();
  if (ix.hintCache.has(selfId)) return ix.hintCache.get(selfId);
  const terms = [...ix.defs.entries()].filter(([k, items]) => k.length >= 4 && !items.some(x => x.recId === selfId))
    .map(([k]) => k).sort((a, b) => b.length - a.length);
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = terms.length ? new RegExp("(^|[^а-яёa-z])(" + terms.map(t => t.split(" ").map(w =>
    reEsc(w.slice(0, Math.max(3, w.length - 2))).replace(/е/g, "[её]") + "[а-яёa-z]{0,4}").join("\\s+")).join("|") + ")(?=[^а-яёa-z]|$)", "gi") : null;
  ix.hintCache.set(selfId, re);
  return re;
}
// разрешение цели ссылки: определение → запись → теоретик → школа; «X (Y)» — уточнение
function resolveTarget(raw) {
  const ix = linkIndex(), k = norm(raw);
  const direct = key => {
    if (ix.defs.has(key)) return { kind: "def", items: ix.defs.get(key) };
    if (ix.titles.has(key)) return { kind: "rec", rec: ix.titles.get(key)[0] };
    if (ix.people.has(key)) return { kind: "person", ent: ix.people.get(key)[0] };
    if (ix.schools.has(key)) return { kind: "school", ent: ix.schools.get(key)[0] };
    return null;
  };
  const d = direct(k);
  if (d) return d;
  const m = k.match(/^(.*?)\s*\(([^)]+)\)$/);
  if (m) {
    const base = m[1].trim(), q = m[2].trim();
    const fits = r => r && (norm(r.title).includes(q) || r.aliases.some(a => norm(a).includes(q)) ||
      namesOf(r.authors, db.people).some(nm => norm(nm).includes(q)) || namesOf(r.schools, db.schools).some(nm => norm(nm).includes(q)));
    const items = (ix.defs.get(base) || []).filter(x => fits(recById(x.recId)));
    if (items.length) return { kind: "def", items };
    const recs = (ix.titles.get(base) || []).filter(fits);
    if (recs.length) return { kind: "rec", rec: recs[0] };
    const b = direct(base);
    if (b) return b;
  }
  return { kind: "dead", name: raw.trim() };
}
// в какие сущности «попадает» ссылка (для обратных связей)
function resolvedKeys(raw) {
  const t = resolveTarget(raw);
  if (t.kind === "def") return uniq(t.items.map(x => "rec:" + x.recId));
  if (t.kind === "rec") return ["rec:" + t.rec.id];
  if (t.kind === "person") return ["person:" + t.ent.id];
  if (t.kind === "school") return ["school:" + t.ent.id];
  return [];
}
const mentionsOf = key => [...((linkIndex().mentions.get(key) || {}).any || [])].map(recById).filter(Boolean);
function incomingOf(recId) {
  const e = linkIndex().incoming.get("rec:" + recId);
  const list = f => e ? [...e[f]].map(recById).filter(Boolean) : [];
  return { response: list("response"), conflicts: list("conflicts"), confuse: list("confuse") };
}

// ---------- Markdown со ссылками ----------
// opt.plain — внутри всплывающей подсказки: ссылки становятся текстом; opt.hints — подчёркивать известные термины
function mdInline(s, opt = {}) {
  const parts = String(s).split(/(\[\[[^\]]+\]\]|\[[^\]]+\]\(https?:\/\/[^)\s]+\)|`[^`]+`)/);
  const hre = opt.hints ? hintReFor(opt.hints) : null;
  let h = parts.map((p, i) => {
    if (i % 2 === 0) {
      let t = esc(p);
      if (hre) t = t.replace(hre, (all, pre, w) => `${pre}<span class="maybe" title="Может, это термин? Есть определение — размечай [[…]], чтобы стала ссылкой">${w}</span>`);
      return t;
    }
    let m;
    if ((m = p.match(/^`([^`]+)`$/))) return `<code>${esc(m[1])}</code>`;
    if ((m = p.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/))) return `<a href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[1])}</a>`;
    m = p.match(/^\[\[(!?)([^\]|]+)(?:\|([^\]]+))?\]\]$/);
    if (!m) return esc(p);
    const target = m[2].trim(), shown = esc((m[3] || m[2]).trim());
    if (m[1]) return `<b class="def" data-defkey="${esc(norm(target))}">${shown}</b>`;
    if (opt.plain) return `<span class="wl-plain">${shown}</span>`;
    const dead = resolveTarget(target).kind === "dead";
    return `<span class="wl${dead ? " dead" : ""}" role="link" tabindex="0" data-link="${esc(target)}">${shown}</span>`;
  }).join("");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return h;
}
// блоки: каждый со своим номером — по нему разбор прокручивает к нужному месту
function mdBlocks(src, opt = {}) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  const blocks = [];
  let para = [], list = null;
  const flushP = () => { if (para.length) { blocks.push({ tag: "p", html: para.map(x => mdInline(x, opt)).join("<br>"), text: para.join(" "), parts: para.slice() }); para = []; } };
  const flushL = () => { if (list) { blocks.push({ tag: list.t, html: list.items.map(x => `<li>${mdInline(x, opt)}</li>`).join(""), text: list.items.join(" "), parts: list.items.slice() }); list = null; } };
  for (const raw of lines) {
    const ln = raw.trimEnd();
    let m;
    if (!ln.trim()) { flushP(); flushL(); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); blocks.push({ tag: m[1].length <= 2 ? "h3" : "h4", html: mdInline(m[2], opt), text: m[2], heading: m[1].length }); continue; }
    if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = ln.match(/^>\s?(.*)$/))) { flushP(); flushL(); blocks.push({ tag: "blockquote", html: mdInline(m[1], opt), text: m[1], parts: [m[1]] }); continue; }
    flushL(); para.push(ln);
  }

}
const blocksHTML = (blocks, from = 0) => blocks.map((b, i) => `<${b.tag} data-b="${i + from}">${b.html}</${b.tag}>`).join("");
const mdRender = (src, opt = {}) => blocksHTML(mdBlocks(src, opt));
// тело записи в том виде, в каком его показывает страница (без «Кратко» и пустых разделов)
const shownBody = r => dropEmptySections(bodyWithoutKratko(r.body));

// ---------- фрагмент конспекта для разбора ----------
// по адресу «->»: определение или раздел; без адреса — абзац с наибольшим числом общих основ слов
function fragmentFor(r, q) {
  const blocks = mdBlocks(shownBody(r), { plain: true });
  if (q.ref) {
    const m = q.ref.match(/^\[\[!?([^\]|]+)(?:\|[^\]]+)?\]\]$/);
    if (m) {
      // тот же разбор цели, что и у ссылок: понимает и «аномия (Мертон)»
      const t = resolveTarget(m[1]);
      if (t.kind === "def") {
        const d = t.items.find(x => x.recId === r.id) || t.items[0];
        return { html: `<p>${mdInline(d.line, { plain: true })}</p>`, guessed: false, recId: d.recId, hl: { def: norm(d.term) } };
      }
    } else {
      const n = norm(q.ref.replace(/^#+\s*/, ""));
      const hi = blocks.findIndex(b => b.heading && norm(b.text) === n);
      if (hi !== -1) {
        let j = hi + 1;
        while (j < blocks.length && !(blocks[j].heading && blocks[j].heading <= blocks[hi].heading)) j++;
        if (j > hi + 1) return { html: blocksHTML(blocks.slice(hi + 1, j)), guessed: false, recId: r.id, hl: { block: hi, until: j } };
      }
    }
  }
  return guessFragment(r, q, blocks);
}

// ---------- подбор фрагмента без адреса ----------
// Ищем предложение, а не абзац: старые конспекты часто набраны без пустых строк и целиком оказываются одним абзацем.
// Слова сравниваются по основам (стеммер Snowball); служебные и вопросительные слова не участвуют;
// вес слова тем больше, чем реже оно в этом конспекте; слова ответа весят вдвое больше слов вопроса.

const FRAG_STOP = new Set(("что как какой какая какое какие каков какова каково каковы кто кого кому чем чём почему зачем где когда " +
  "сколько чей чья чьи такое такой такая такие это этот эта эти тот та те то по для при или либо его ее её их ему им был была было " +
  "были быть есть назови назовите перечисли перечислите опиши объясни приведи укажи дай свой свои который которая которое которые " +
  "также так же ли не ни и в во на с со к ко о об от до из у за над под про через между после перед а но да бы чтобы если тоже " +
  "более менее очень всё все весь вся всех один одна одно сам сама само чего него нее неё ней них против кроме вместо " +
  "своей своих своего своему своим своё свою своя своими этой этого этих этим этому этими той того тех тому тем теми " +
  "которой которого которых которому которым которую которыми каким какому каких какими какую какой какого чему кем ком").split(" "));

}
function guessFragment(r, q, blocks) {
  // кандидаты — предложения и пары соседних предложений одного абзаца: имя часто стоит в одном, а суть — в следующем
  const units = [], sents = [];
  blocks.forEach((b, i) => {
    if (b.heading) return;
    const ss = (b.parts || [b.text]).flatMap(splitSentences);
    ss.forEach((sen, k) => {
      const one = { block: i, raw: sen, stems: uniq(fragTokens(sen)), pair: false };
      sents.push(one); units.push(one);
      if (k) units.push({ block: i, raw: ss[k - 1] + " " + sen, stems: uniq([...fragTokens(ss[k - 1]), ...one.stems]), pair: true });
    });

  if (!units.length) return null;
  const N = sents.length, df = new Map();
  for (const u of sents) for (const st of u.stems) df.set(st, (df.get(st) || 0) + 1);
  const dfOf = st => { let n = df.get(st) || 0; if (!n) for (const [k, v] of df) if (stemEq(k, st)) n = Math.max(n, v); return n; };
  const idf = st => Math.log(1 + N / Math.max(1, dfOf(st)));

  const qSt = uniq(fragTokens(q.q)), aSt = uniq(fragTokens(q.a || ""));
  const weight = new Map();
  for (const st of qSt) weight.set(st, (titleSt.has(st) ? 0.3 : 1));
  for (const st of aSt) weight.set(st, Math.max(weight.get(st) || 0, titleSt.has(st) ? 0.6 : 2));
  // ответ есть, но ни одно его слово не встречается в конспекте — ответа здесь, скорее всего, нет
  const aPresent = aSt.filter(st => dfOf(st) > 0);
  if (aSt.length && !aPresent.length) return null;
  // значимые слова вопроса (без названия записи): если больше половины их в конспекте нет, вопрос, похоже, о другом
  const qInf = qSt.filter(st => !titleSt.has(st));
  const qMissing = qInf.length >= 2 && qInf.filter(st => dfOf(st) > 0).length / qInf.length < 0.5;
  // сколько слов ответа должно совпасть в одном месте: у коротких ответов — одно, у средних — два, у длинных — 40%
  const need = aSt.length <= 2 ? 1 : aSt.length <= 4 ? 2 : Math.ceil(aSt.length * 0.4);

    let sc = 0, aHits = 0;

    for (const [st, w] of weight) if (u.stems.some(x => stemEq(x, st))) { sc += w * idf(st); hit.push(st); if (aSt.includes(st)) aHits++; }

  if (!best || !best.sc) return null;

  if (qMissing && !(aSt.length && best.aHits / aSt.length >= 0.75)) return null;
  // без слов ответа нужна уверенность: хотя бы два значимых слова вопроса
  if (!aSt.length && best.hit.filter(st => !titleSt.has(st)).length < 2) return null;
  const html = `<p>${esc(plainText(best.u.raw)).replace(/[a-zа-яё0-9]+/gi, w => {
    const n = norm(w);
    return !FRAG_STOP.has(n) && best.hit.some(st => stemEq(fragStem(n), st)) ? `<mark>${w}</mark>` : w; })}</p>`;
  return { html, guessed: true, recId: r.id, hl: { block: best.u.block, until: best.u.block + 1 } };
}

const WORD_RE = /[a-zа-яё0-9]+/gi;
const words = s => (norm(s).match(WORD_RE) || []);

// расстояние Дамерау — Левенштейна с ранним выходом, когда оно уже больше k
function dl(a, b, k) {
  if (Math.abs(a.length - b.length) > k) return k + 1;
  const n = a.length, m = b.length;
  let p2 = null, p1 = Array.from({ length: m + 1 }, (_, j) => j);
  for (let i = 1; i <= n; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= m; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(p1[j] + 1, cur[j - 1] + 1, p1[j - 1] + c);
      if (p2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, p2[j - 2] + 1);
      cur[j] = v; if (v < rowMin) rowMin = v;
    }
    if (rowMin > k) return k + 1;
    p2 = p1; p1 = cur;
  }
  return p1[m];
}
// сколько опечаток прощаем: короткому слову — ни одной, среднему — одну, длинному — две
const typoBudget = len => len <= 4 ? 0 : len <= 7 ? 1 : 2;

let _sidx = null, _sidxV = -1;
function searchIndex() {
  if (_sidx && _sidxV === dbVersion) return _sidx;
  const vocab = new Map(), docs = [];
  const field = (kind, weight, text) => {
    const set = new Set(words(text));
    for (const w of set) if (!vocab.has(w)) vocab.set(w, stemOf(w));
    return { kind, weight, set, text };
  };
  for (const r of db.records) {
    const defLines = [...r.body.matchAll(/^.*\[\[![^\]]+\]\].*$/gm)].map(m => m[0]);
    docs.push({ type: "rec", ent: r, fields: [
      field("title", 3, [r.title, ...r.aliases].join(" ")),
      field("def", 2, defLines.map(plainText).join(" ")),
      field("text", 1, plainText(r.body)),
    ], defLines });
  }
  for (const p of db.people) docs.push({ type: "person", ent: p, fields: [field("title", 3, variantsOf(p).join(" "))] });
  for (const x of db.schools) docs.push({ type: "school", ent: x, fields: [field("title", 3, variantsOf(x).join(" "))] });

// слова базы, подходящие к слову запроса: та же основа (1), начало слова при наборе (0,9), опечатка (0,7)
function matchWord(qt, vocab) {
  const qs = stemOf(qt), k = typoBudget(qt.length), out = new Map();
  for (const [w, ws] of vocab) {
    let q = 0;
    if (w === qt || ws === qs) q = 1;
    else if (qt.length >= 2 && w.startsWith(qt)) q = 0.9;
    else if (k && (dl(ws, qs, k) <= k || dl(w, qt, k) <= k)) q = 0.7;
    if (q) out.set(w, q);
  }

}
function searchAll(query) {
  const qts = uniq(words(query)).filter(t => t.length >= 2 || /\d/.test(t));
  if (!qts.length) return null;
  const { vocab, docs } = searchIndex();
  const matches = qts.map(t => matchWord(t, vocab));
  const hit = [];
  for (const d of docs) {
    let score = 0, bestField = null, bestW = 0;
    const found = new Set();
    let all = true;
    for (const m of matches) {
      let best = 0, bf = null;
      for (const f of d.fields) for (const w of f.set) { const q = m.get(w); if (q && q * f.weight > best) { best = q * f.weight; bf = f; } }
      if (!best) { all = false; break; }
      score += best;
      for (const f of d.fields) for (const w of f.set) if (m.has(w)) found.add(w);
      if (bf && bf.weight > bestW) { bestW = bf.weight; bestField = bf; }
    }
    if (all) hit.push({ d, score, field: bestField, found });
  }
  hit.sort((a, b) => b.score - a.score || (a.d.ent.title || a.d.ent.name).localeCompare(b.d.ent.title || b.d.ent.name, "ru"));
  return { recs: hit.filter(h => h.d.type === "rec"), people: hit.filter(h => h.d.type === "person"), schools: hit.filter(h => h.d.type === "school") };
}
// подсветка найденных слов в произвольном тексте
function markWords(text, found) {
  return esc(text).replace(/[a-zа-яё0-9]+/gi, w => found.has(norm(w)) ? `<mark>${w}</mark>` : w);
}
// строка под результатом: синоним, определение или кусок конспекта вокруг первого совпадения
function snippetOf(h) {
  const { d, field, found } = h;
  if (d.type !== "rec" || !field) return "";
  const r = d.ent;
  if (field.kind === "title") {
    const al = r.aliases.find(a => words(a).some(w => found.has(w)));
    return al && !words(r.title).some(w => found.has(w)) ? `синоним: ${markWords(al, found)}` : "";
  }
  if (field.kind === "def") {
    const line = d.defLines.find(l => words(l).some(w => found.has(w))) || d.defLines[0] || "";
    return markWords(plainText(line), found);
  }
  const lines = plainText(r.body).split("\n").map(l => l.replace(/^#+\s*/, "").trim()).filter(Boolean);
  const line = lines.find(l => words(l).some(w => found.has(w))) || "";
  const ws = words(line), first = ws.findIndex(w => found.has(w));
  let s = line;
  if (s.length > 140 && first > 0) {
    const pos = norm(line).indexOf(ws[first]);
    const start = Math.max(0, pos - 50);
    s = (start ? "…" : "") + line.slice(start, start + 140) + (start + 140 < line.length ? "…" : "");
  } else if (s.length > 140) s = s.slice(0, 140) + "…";
  return markWords(s, found);
}
