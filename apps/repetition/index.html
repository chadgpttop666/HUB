// =====================================================================
//  ZIP: экспорт базы и дневника двумя файлами в одном архиве
// =====================================================================
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// архив без сжатия: файлы JSON маленькие, а распаковывает его любой архиватор
function makeZip(files) {
  const enc = new TextEncoder(), now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const chunks = [], central = [];
  let offset = 0;
  for (const f of files) {
    const data = enc.encode(f.text), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
// чтение: свои архивы без сжатия и пересжатые системой (deflate) — через встроенный распаковщик браузера
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd === -1) throw new Error("не похоже на zip-архив");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("архив повреждён");
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (name.endsWith("/")) continue;
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    const raw = u8.subarray(start, start + csize);
    let text;
    if (method === 0) text = dec.decode(raw);
    else if (method === 8) {
      if (typeof DecompressionStream === "undefined") throw new Error("браузер не умеет распаковывать сжатые архивы — распакуй его и загрузи файлы по одному");
      text = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    } else throw new Error(`неизвестный способ сжатия (${method})`);
    out.push({ name, text });
  }
  return out;
}

// ---------- шапка ----------
function logSummary() {
  const n = db.log.length, ok = db.log.filter(x => x[2] === 1).length;
  return { n, ok, share: n ? ok / n : 0 };
}
function streakDays(map) {
  let s = 0, d = todayISO();
  if (!map[d]) d = addDays(d, -1);
  while (map[d]) { s++; d = addDays(d, -1); }
  return s;
}
function bestStreak(map) {
  const days = Object.keys(map).filter(d => map[d] > 0).sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days) { cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
  return best;
}
function dueCounts(t) {
  const inRep = db.records.filter(r => activeQs(r).length);
  return { topics: inRep.filter(r => topicDue(r, t)).length,
           questions: inRep.reduce((a, r) => a + dueQs(r, t).length, 0) };
}

// ---------- метки ----------
function tagHTML(r) {
  const tg = r.disciplines[0] ? cap(r.disciplines[0]) : r.topics[0];
  return tg ? `<span class="tag">${esc(tg)}</span>` : "";
}
// ответы за сегодня: id вопроса → последний ответ (журнал идёт по порядку, поэтому читаем с конца)
function todayAnswers(t) {
  const dn = dayNum(t), m = new Map();
  for (let i = db.log.length - 1; i >= 0; i--) {
    const e = db.log[i];
    if (e[0] < dn) break;
    if (e[0] === dn && !m.has(e[1])) m.set(e[1], e[2]);
  }
  return m;
}
// в день повтора модель FSRS даёт ~100% любому вопросу — показываем результат сессии, а не процент
function todayResult(r, t) {
  const ans = todayAnswers(t);
  const got = r.questions.filter(q => ans.has(q.id));
  if (!got.length) return null;
  return { n: got.length, ok: got.filter(q => ans.get(q.id) === 1).length };
}
function stagePill(r, t) {
  const st = stageOf(r);
  if (st === "materials") return `<span class="pill grey">материал</span>`;
  if (st === "heard") return `<span class="pill dash">услышал</span>`;
  if (st === "notes") return `<span class="pill grey">конспект</span>`;
  const m = meanR(r, t);
  if (m == null) return `<span class="pill grey">на паузе</span>`;
  const tr = todayResult(r, t);
  if (tr) return `<span class="pill ${tr.ok === tr.n ? "" : "warn"}">сегодня ${tr.ok} из ${tr.n}</span>`;
  if (activeQs(r).every(q => q.s == null)) return `<span class="pill">новые вопросы</span>`;
  return `<span class="pill ${m >= retentionOf(r) ? "" : "warn"}">помню ${pct(m)}%</span>`;
}
function whenText(iso) {
  const n = daysUntil(iso);
  return n <= 0 ? "сегодня" : n === 1 ? "завтра" : `${fmtShort(iso)}, через ${n} ${plural(n, ["день", "дня", "дней"])}`;
}

// ---------- сессия ----------
function startSession(recId, scope) {
  const r = rec(recId), t = todayISO();
  if (!r) return;
  const qs = scope === "due" ? dueQs(r, t) : activeQs(r);
  if (!qs.length) { toast("В этой записи нечего повторять."); return; }

  activeTab = "rep";
  render();
}
const sessQ = r => r.questions.find(x => x.id === session.qids[session.idx]);
function sessionHTML() {
  const r = rec(session.recId);
  if (!r) { session = null; return ""; }
  if (session.done) return summaryHTML(r);
  const q = sessQ(r);
  if (!q) { session.done = true; return summaryHTML(r); }
  const n = session.qids.length, i = session.idx;
  const ans = session.revealed
    ? (q.a ? `<div class="q-ans">${esc(q.a)}</div>` : `<div class="q-ans none">Ответа нет — сверься с конспектом после сессии.</div>`)
    : "";

    ? `<div class="q-actions">
         <button class="g-btn g-fail" data-ans="0">Не помню<small>клавиша 1</small></button>
         <button class="g-btn g-ok" data-ans="1">Помню<small>клавиша 2</small></button></div>`
    : `<div class="q-actions"><button class="reveal" data-reveal="1">Показать ответ<small>пробел</small></button></div>`;
  return `<div class="sess-top">
      <div class="sess-name">${esc(r.title)}</div>
      <button class="btn btn-ghost btn-sm" data-sess-exit="1" title="Выйти — данные ответы сохранятся">✕ Выйти</button></div>
    <div class="prog" aria-hidden="true"><div style="width:${100 * i / n}%"></div></div>
    <div class="prog-label">${i + 1} из ${n}${q.s == null ? " · новый вопрос" : ""}</div>
    <div class="q-card">
      <div class="q-text">${esc(q.q)}</div>
      ${ans}${actions}
    </div>
    <div class="keys">Ctrl+Z — отменить последний ответ · Esc — выйти</div>`;
}
function summaryHTML(r) {
  const t = todayISO();
  const last = new Map();
  for (const a of session.answers) last.set(a.qid, a.ok);
  const n = last.size, ok = [...last.values()].filter(Boolean).length;
  const failed = [...last.entries()].filter(([, v]) => !v).map(([id]) => r.questions.find(q => q.id === id)).filter(Boolean);
  const nextTxt = activeQs(r).length ? `Следующий повтор темы — ${whenText(topicMatureDate(r, t))}.` : "";
  const fails = failed.map(q => `<div class="fail-item">
      <div class="fail-q">${esc(q.q)}</div>
      <div class="fail-a">${q.a ? esc(q.a) : "Ответа нет — сверься с конспектом."}</div>
      ${fragHTML(r, q)}
      <div class="grades" style="margin-top:10px">
        <button class="btn btn-sm ${q.bad ? "on" : "btn-outline"}" data-flag-bad="${q.id}"
          title="Двусмысленная формулировка — вопрос встанет на паузу, пока его не перепишешь">${q.bad ? "✓ Вопрос плохой" : "Вопрос плохой"}</button>
        <button class="btn btn-sm ${q.later ? "on" : "btn-outline"}" data-flag-later="${q.id}"
          title="Вопрос продолжит повторяться и попадёт в список на разбор">${q.later ? "✓ Разобрать позже" : "Разобрать позже"}</button>
      </div></div>`).join("");
  return `<div class="card">
      <div class="sum-big">Помню ${ok} из ${n}</div>
      <div class="meta" style="font-size:14px">${nextTxt}</div>
      <div class="grades">
        <button class="btn btn-primary" data-sess-close="1">К списку</button>
        <button class="btn btn-outline btn-sm" data-open="${r.id}">Открыть запись</button>
      </div></div>
    ${failed.length ? `<div class="section-title">Разбор <span class="hint" style="font-size:13px">не вспомнил: ${failed.length}</span></div>
      <div class="card">${fails}</div>` : ""}
    <div class="keys">Ctrl+Z — отменить последний ответ</div>`;
}
// место конспекта, откуда берётся ответ
function fragHTML(r, q) {
  const f = fragmentFor(r, q);
  if (!f) return hasNotes(r.body) ? `<div class="frag"><button class="btn btn-ghost btn-sm" data-open="${r.id}">Открыть конспект целиком</button></div>` : "";
  const other = f.recId !== r.id && rec(f.recId);
  return `<div class="frag">
      <div class="frag-src">${f.guessed ? "Похоже, отсюда" : "Из конспекта"}${other ? ` «${esc(other.title)}»` : ""}</div>
      <div class="md">${f.html}</div>
      <button class="btn btn-ghost btn-sm" data-open-hl="${f.recId}" data-hl="${esc(JSON.stringify(f.hl))}">Открыть в конспекте</button></div>`;
}
function reveal() { if (session && !session.done) { planTick(); session.revealed = true; render(); } }
function answer(ok) {
  if (!session || session.done || !session.revealed) return;
  const r = rec(session.recId), q = r && sessQ(r);
  if (!q) return;
  const t = todayISO();
  planTick();
  if (!session.counted) { db.plan.sessions[t] = (db.plan.sessions[t] || 0) + 1; session.counted = true; }
  const before = Object.assign({}, q);
  const sameDay = q.s != null && q.last === t;
  if (!sameDay) {
    const { s, d, last, due, reps, lapses } = fsrsReview(q, ok, t, retentionOf(r));
    Object.assign(q, { s, d, last, due, reps, lapses });
  }
  db.log.push([dayNum(t), q.id, ok ? 1 : 0, sameDay ? 1 : 0]);
  session.answers.push({ qid: q.id, ok, before });
  r.snooze = null;
  session.idx++; session.revealed = false;
  if (session.idx >= session.qids.length) session.done = true;
  saveDB(); render();
}
function undoAnswer() {
  if (!session || !session.answers.length) return;
  const a = session.answers.pop(), r = rec(session.recId);
  const q = r && r.questions.find(x => x.id === a.qid);
  if (q) { const flags = { bad: q.bad, later: q.later }; Object.assign(q, a.before, flags); }
  for (let i = db.log.length - 1; i >= 0; i--) if (db.log[i][1] === a.qid) { db.log.splice(i, 1); break; }
  session.idx = session.qids.indexOf(a.qid); session.revealed = true; session.done = false;
  saveDB(); render(); toast("Ответ отменён — оцени вопрос заново.");
}
function exitSession() {
  if (!session) return;
  if (!session.done) { planTick(); saveDB(); }
  const answered = session.answers.length, done = session.done;
  session = null; render();
  if (!done && answered) toast(`Сессия прервана. Ответов сохранено: ${answered}.`);
}

function applyHighlight() {
  const top = navTop(), hl = top.hl;

  top.hl = null;

    const root = $("section-base");
    let els = [];
    if (hl.def) { const d = root.querySelector(`.md [data-defkey="${CSS.escape(hl.def)}"]`); if (d) els = [d.closest("[data-b]") || d]; }
    else if (hl.block != null)
      for (let i = hl.block; i < (hl.until ?? hl.block + 1); i++) { const e = root.querySelector(`.md [data-b="${i}"]`); if (e) els.push(e); }
    if (!els.length) return;
    els[0].scrollIntoView({ block: "center" });
    els.forEach(e => e.classList.add("flash"));

}
const openRecord = id => navTo({ kind: "rec", id });
const openPerson = id => navTo({ kind: "person", id });

function renderBase() {

// темы: свёрнуто — ровно две строки; кнопка «все темы» появляется, только если что-то не влезло
let topicsOpen = false, topicFind = "";
function fitTopics() {

  if (!first) return;

  lines.forEach((l, i) => {

// вид куска: «тип:» в шапке решает сразу; иначе теоретика выдают его поля, школу — раздел «Справка» без вопросов
function detectKind(lines) {
  const sep = lines.findIndex((l, i) => i > 0 && /^-{3,}\s*$/.test(l));
  const head = lines.slice(1, sep === -1 ? lines.length : sep), body = sep === -1 ? [] : lines.slice(sep + 1);
  const keyOf = l => { const m = l.match(/^([^:]+):/); return m ? norm(m[1]) : ""; };
  const typeLine = head.find(l => keyOf(l) === "тип");
  if (typeLine) {
    const v = norm(typeLine.split(":").slice(1).join(":"));
    if (v.startsWith("теорет")) return "person";
    if (v.startsWith("школ")) return "school";
    if (v.startsWith("запис") || v.startsWith("теори")) return "rec";
  }
  const keys = head.map(keyOf);
  if (keys.some(k => k === "варианты" || k === "годы")) return "person";
  const spravka = body.some(l => /^#{2,6}\s*справка\s*$/i.test(l.trim()));
  const questions = body.some(l => /^#{2,6}\s*вопросы\s*$/i.test(l.trim()));
  if (spravka && !questions) return keys.includes("школы") ? "person" : "school";
  return "rec";
}

  const sim = similarEntity(name, coll);
  if (sim) {
    const v = await askAsync(`«${name}» ${P ? "похож" : "похожа"} на «${sim.name}» — ${P ? "он" : "она"} уже есть в базе. Это ${P ? "он же" : "она же"}?`, [
      { label: "Отмена", value: null }, { label: P ? "Создать нового" : "Создать новую", cls: "btn-outline", value: "new" },
      { label: `Обновить «${sim.name}»`, cls: "btn-primary", value: "upd" }]);
    if (v === null) return null;
    if (v === "upd") return sim;
  }
  const e = (P ? fixPerson : fixSchool)({ name });
  coll.push(e);
  return e;
}
const mergeAliases = (e, list, name) => uniq([...(e.aliases || []), ...list]).filter(v => norm(v) !== norm(name));
async function addFull() {
  const ta = $("add-full");
  const text = ta ? ta.value : "";
  addPanel.text.full = text;
  const chunks = splitRecords(text);
  if (!chunks.length) { addPanel.error = "Не нашёл ни одной записи: каждая начинается со строки «# Название»."; render(); return; }
  const parsed = [];
  for (const c of chunks) {
    const kind = detectKind(c.lines);
    // строку «тип:» убираем до разбора: это пометка для вставки, а не поле
    const src = c.lines.map(l => /^\s*тип\s*:/i.test(l) ? "" : l).join("\n");
    const res = kind === "rec" ? parseRecord(src) : parseEntity(src, kind === "person" ? PERSON_FIELDS : SCHOOL_FIELDS);
    if (res.error) {
      const hint = kind === "rec" ? " Если это теоретик или школа, добавь в шапку строку «тип: теоретик» или «тип: школа»." : "";
      addPanel.error = `Строка ${c.start + res.error.line} (${KIND_RU[kind][0]} «${(c.lines[0] || "").replace(/^#\s*/, "")}»): ${res.error.msg}${hint}`;
      render(); return;
    }
    parsed.push({ kind, data: res.data });
  }
  const cnt = k => parsed.filter(x => x.kind === k).length;
  if (cnt("person") || cnt("school")) {
    const parts = ["school", "person", "rec"].filter(k => cnt(k)).map(k => `${KIND_RU[k][2]}: ${cnt(k)}`);
    const ok = await askAsync(`Нашёл в тексте — ${parts.join(", ")}.\n\n${parsed.filter(x => x.kind !== "rec").map(x => `— ${KIND_RU[x.kind][0]}: ${x.data.name}`).join("\n")}\n\nВсё верно?`,
      [{ label: "Отмена", value: false }, { label: "Добавить", cls: "btn-primary", value: true }]);
    if (!ok) return;
  }
  const done = { rec: [0, 0], person: [0, 0], school: [0, 0] };   // [добавлено, обновлено]
  let aborted = false;
  // 1) школы: сначала все имена, потом конфликты — так ссылки внутри одной вставки находят друг друга
  const schools = parsed.filter(x => x.kind === "school");
  for (const x of schools) {
    const known = [x.data.name, ...x.data.aliases].some(v => findByName(db.schools, v));
    const e = await pickEntity("school", x.data.name, x.data.aliases);
    if (e === null) { aborted = true; break; }
    if (e === "skip") continue;
    Object.assign(e, { name: x.data.name, aliases: mergeAliases(e, x.data.aliases, x.data.name), body: x.data.body, updated: todayISO() });
    x.ent = e; done.school[known ? 1 : 0]++;
  }
  if (!aborted) for (const x of schools.filter(y => y.ent)) {
    const conflicts = [];
    for (const raw of x.data.conflicts) {
      const tn = conflictTargetName(raw);
      let target = null;
      if (tn && norm(tn) !== norm(x.data.name)) { const ids = await resolveInteractive([tn], "schools"); if (!ids) { aborted = true; break; } target = ids[0]; }
      conflicts.push({ raw, target });
    }
    if (aborted) break;
    x.ent.conflicts = conflicts;
  }
  // 2) теоретики
  if (!aborted) for (const x of parsed.filter(y => y.kind === "person")) {
    const known = [x.data.name, ...x.data.aliases].some(v => findByName(db.people, v));
    const e = await pickEntity("person", x.data.name, x.data.aliases);
    if (e === null) { aborted = true; break; }
    if (e === "skip") continue;
    const schoolIds = await resolveInteractive(x.data.schools, "schools");
    if (!schoolIds) { aborted = true; break; }
    Object.assign(e, { name: x.data.name, aliases: mergeAliases(e, x.data.aliases, x.data.name), years: x.data.years || e.years,
                       schools: schoolIds, body: x.data.body, updated: todayISO() });
    done.person[known ? 1 : 0]++;
  }
  saveDB();
  // 3) записи
  if (!aborted) for (const x of parsed.filter(y => y.kind === "rec")) {
    const d = x.data;
    const { exact, similar } = recordMatch(d.title);
    const twin = exact || similar;
    let target = null;
    if (twin) {
      const v = await askAsync(`${exact ? "Запись" : "Похожая запись"} «${twin.title}» уже есть${exact ? "" : ` (вставляешь «${d.title}»)`}. Обновить её этим текстом или создать новую?`, [
        { label: "Пропустить", value: "skip" }, { label: "Создать новую", cls: "btn-outline", value: "new" },
        { label: "Обновить её", cls: "btn-primary", value: "upd" }]);
      if (v === null) { aborted = true; break; }
      if (v === "skip") continue;
      if (v === "upd") target = twin;
    }
    const r = await commitRecord(target, d);
    if (!r) { aborted = true; break; }
    done.rec[target ? 1 : 0]++;
  }
  const total = Object.values(done).reduce((s, [a, u]) => s + a + u, 0);
  const summary = ["rec", "person", "school"].filter(k => done[k][0] + done[k][1]).map(k => {
    const [a, u] = done[k];
    return `${KIND_RU[k][2]} — ${[a && `добавлено ${a}`, u && `обновлено ${u}`].filter(Boolean).join(", ")}`;
  }).join("; ");
  if (total && !aborted) { addPanel.text.full = ""; addPanel.error = null; }
  render();
  if (total) toast(`${aborted ? "Прервано на середине. Успело: " : ""}${summary.replace(/^./, c => c.toUpperCase())}.`);
}

// ---------- проверка имён, тем и дисциплин при сохранении ----------
async function resolveInteractive(names, key) {
  const coll = db[key], isP = key === "people", ids = [];
  for (const raw of names) {
    const name = raw.trim();
    if (!name) continue;
    const ex = findByName(coll, name);
    if (ex) { ids.push(ex.id); continue; }
    const sim = similarEntity(name, coll);
    if (sim) {
      const v = await askAsync(`${isP ? "Новый теоретик" : "Новая школа"} «${name}» ${isP ? "похож" : "похожа"} на «${sim.name}». Это ${isP ? "он же" : "она же"}?`, [
        { label: "Отмена", value: null }, { label: isP ? "Создать нового" : "Создать новую", cls: "btn-outline", value: "new" },
        { label: `Привязать к «${sim.name}»`, cls: "btn-primary", value: "link" }]);
      if (v === null) return null;
      if (v === "link") { if (!variantsOf(sim).some(a => norm(a) === norm(name))) sim.aliases.push(name); ids.push(sim.id); continue; }
    }
    const e = (isP ? fixPerson : fixSchool)({ name });
    coll.push(e); ids.push(e.id);
  }
  return uniq(ids);
}
async function resolveTopics(topics, exceptRec) {
  const known = [...new Set(db.records.filter(r => r !== exceptRec).flatMap(r => r.topics))], out = [];
  for (const tp of topics) {
    if (known.includes(tp) || out.includes(tp)) { if (!out.includes(tp)) out.push(tp); continue; }
    const sim = similarTopic(tp, known);
    if (sim) {
      const v = await askAsync(`Новая тема «${tp}» похожа на уже существующую «${sim}». Взять существующую?`, [
        { label: "Отмена", value: null }, { label: "Оставить новую", cls: "btn-outline", value: "new" },
        { label: `Взять «${sim}»`, cls: "btn-primary", value: "use" }]);
      if (v === null) return null;
      if (v === "use") { if (!out.includes(sim)) out.push(sim); continue; }
    }
    out.push(tp);   // с собственными темами записи не сравниваем: обе указаны сознательно
  }
  return out;
}
async function resolveDisciplines(discs) {
  const list = db.meta.settings.disciplines, keep = [], asTopics = [];
  for (const d of discs) {
    if (list.includes(d)) { keep.push(d); continue; }
    const v = await askAsync(`Дисциплины «${d}» нет в списке (${list.join(", ")}). Добавить её в список или записать как тему?`, [
      { label: "Отмена", value: null }, { label: "Записать темой", cls: "btn-outline", value: "topic" },
      { label: "Добавить в список", cls: "btn-primary", value: "add" }]);
    if (v === null) return null;
    if (v === "add") { list.push(d); keep.push(d); } else asTopics.push(d);
  }
  return { keep: uniq(keep), asTopics };
}
// сохранение записи: вопросы, имена, темы — с вопросами там, где есть сомнение
async function commitRecord(target, d) {
  const merged = mergeQuestions(target ? target.questions : [], d.questions, db.meta.settings.matchThreshold);
  if (merged.removed.length) {
    const n = merged.removed.length;
    const ok = await confirmAsync(`В «${d.title}»: удалить ${n} ${plural(n, Q_FORMS)} с прогрессом повторений?\n\n${merged.removed.map(q => "— " + q.q).join("\n")}`, "Удалить");
    if (!ok) return null;
  }
  const dres = await resolveDisciplines(d.disciplines);
  if (!dres) return null;
  const topics = await resolveTopics(uniq([...d.topics, ...dres.asTopics]), target);
  if (!topics) return null;
  const authors = await resolveInteractive(d.authors, "people");
  if (!authors) return null;
  const schools = await resolveInteractive(d.schools, "schools");
  if (!schools) return null;
  const r = target || fixRecord({});
  const oldRet = target ? retentionOf(target) : null;
  Object.assign(r, { title: d.title, aliases: d.aliases, disciplines: dres.keep, topics, authors, schools,
                     links: d.links, body: d.body, retention: d.retention, questions: merged.questions, updated: todayISO() });
  if (r.inbox && r.questions.length) r.inbox = false;
  const newRet = retentionOf(r);
  if (oldRet != null && oldRet !== newRet)
    for (const q of r.questions) if (q.s != null) q.due = addDays(q.last, intervalDays(q.s, newRet));
  if (!target) db.records.push(r);
  saveDB();
  return r;
}

// имя совпало с другим теоретиком или школой — предложить объединить
async function maybeMerge(kind, ent, name, aliases) {
  const coll = kind === "person" ? db.people : db.schools;
  const twin = [name, ...aliases].map(v => findByName(coll, v, ent ? ent.id : null)).find(Boolean);
  if (!twin) return { ok: true };
  const v = await askAsync(`«${twin.name}» уже есть в базе. Объединить с ним? Ссылки из записей перейдут на одну карточку.`, [
    { label: "Отмена", value: null }, { label: "Объединить", cls: "btn-primary", value: "merge" }]);

}
async function savePersonEditor() {
  const res = parseEntity(editor.text, PERSON_FIELDS);
  if (res.error) { editor.error = res.error; render(); return null; }
  editor.error = null;
  const d = res.data;
  let p = editor.id && person(editor.id);
  const mg = await maybeMerge("person", p, d.name, d.aliases);
  if (!mg.ok) return null;
  const schools = await resolveInteractive(d.schools, "schools");

  if (!p) { p = fixPerson({ name: d.name }); db.people.push(p); }
  Object.assign(p, { name: d.name, aliases: d.aliases.filter(a => norm(a) !== norm(d.name)), years: d.years, schools, body: d.body, updated: todayISO() });

async function saveSchoolEditor() {
  const res = parseEntity(editor.text, SCHOOL_FIELDS);

  const d = res.data;

  if (!mg.ok) return null;
  if (!x) { x = fixSchool({ name: d.name }); db.schools.push(x); }
  const conflicts = [];
  for (const raw of d.conflicts) {
    const tn = conflictTargetName(raw);

    if (tn && norm(tn) !== norm(d.name)) {
      const ids = await resolveInteractive([tn], "schools");
      if (!ids) return null;

    conflicts.push({ raw, target });

  Object.assign(x, { name: d.name, aliases: d.aliases.filter(a => norm(a) !== norm(d.name)), conflicts, body: d.body, updated: todayISO() });
  if (mg.twin) { mergeSchools(x.id, mg.twin.id); x = mg.twin; }

function donutSVG(ok, fail) {
  const n = ok + fail, R = 42, C = 2 * Math.PI * R, part = n ? ok / n : 0;
  return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Доля «помню»: ${pct(part)}%">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--danger-soft)" stroke-width="16"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--accent)" stroke-width="16" stroke-dasharray="${C * part} ${C}"
      transform="rotate(-90 60 60)" stroke-linecap="${part > 0 && part < 1 ? "round" : "butt"}"/>
    <text x="60" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="inherit">${n ? pct(part) + "%" : "—"}</text></svg>`;
}
function renderStats() {
  const t = todayISO(), map = logCountByDay(), ls = logSummary();
  const qs = db.records.flatMap(r => activeQs(r).filter(q => q.s != null && !snoozed(r, t)));
  const overdue = qs.filter(q => q.due < t).length;
  const inRep = db.records.filter(r => activeQs(r).length).length;
  const nums = [
    [streakDays(map), " дн.", "текущая серия"], [bestStreak(map), " дн.", "лучшая серия"],
    [ls.n, "", "всего ответов"], [ls.n ? pct(ls.share) + "%" : "—", "", "доля «помню»"],
    [overdue, "", "вопросов просрочено сейчас"], [inRep, "", "тем в повторении"],
  ];
  const weeks = 16, dow = (new Date(t + "T00:00:00").getDay() + 6) % 7, end = addDays(t, 6 - dow), start = addDays(end, -(weeks * 7 - 1));
  let cells = "";
  for (let w = 0; w < weeks; w++) for (let r = 0; r < 7; r++) {
    const d = addDays(start, w * 7 + r), future = daysBetween(t, d) > 0, n = map[d] || 0;
    cells += `<div class="hmcell" style="background:${future ? "transparent" : heatColor(n)}" title="${fmt(d)}: ${n}"></div>`;
  }
  const b = stabilityBuckets(), maxB = Math.max(1, ...b.counts);
  const bars = STAB_BUCKETS.map(([label], i) => `<div class="barrow"><span class="bl">${label}</span>
      <span class="bt"><span class="bf" style="width:${100 * b.counts[i] / maxB}%"></span></span><span class="bn">${b.counts[i]}</span></div>`).join("");
  $("section-stats").innerHTML = `<div class="statgrid">${nums.map(([v, s, l]) =>
      `<div class="statcard"><div class="v">${v}<small>${s}</small></div><div class="l">${l}</div></div>`).join("")}</div>
    <div class="card"><div class="stat-title">Ответы за 16 недель</div><div class="hm">${cells}</div>
      <div class="hint" style="margin-top:8px">Дни до перехода на новую версию считаются по прежним итогам за день.</div></div>
    <div class="stat-pair">
      <div class="card"><div class="stat-title">Помню и не помню</div>
        <div class="donut-wrap">${donutSVG(ls.ok, ls.n - ls.ok)}
          <div class="dleg"><div><span class="dot-l" style="background:var(--accent)"></span>помню — ${ls.ok}</div>
            <div><span class="dot-l" style="background:var(--danger-soft); border:1px solid var(--danger)"></span>не помню — ${ls.n - ls.ok}</div></div></div></div>
      <div class="card"><div class="stat-title">Вопросы по стабильности</div>${bars}
        <div class="hint" style="margin-top:8px">Стабильность — через сколько дней вероятность вспомнить упадёт до 90%. Если масса сдвигается вниз по списку, материал закрепляется.${b.fresh ? ` Новых вопросов ещё без оценки: ${b.fresh}.` : ""}</div></div>
    </div>` + planStatsHTML();
}

// ---------- значения ----------
const visibleActs = () => db.plan.acts.filter(a => !a.hidden);

const autoMin = d => Math.round((db.plan.timed[d] || 0) / 60);
function actValue(a, d) {
  const e = db.plan.days[d] || {};
  if (a.auto === "cards") { const v = (e[a.id] || 0) + autoMin(d); return e[a.id] === undefined && !autoMin(d) ? undefined : Math.max(0, v); }
  return e[a.id];
}
const dayFilled = d => (db.plan.days[d] && Object.keys(db.plan.days[d]).length > 0) || autoMin(d) > 0;
const planDayNum = d => db.plan.start ? daysBetween(db.plan.start, d) + 1 : null;
const fmtHours = min => (Math.round(min / 6) / 10).toString().replace(".", ",") + " ч";
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const WD_LONG = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const wdOf = d => new Date(d + "T12:00:00").getDay();
const dayMonth = d => { const [, m, dd] = d.split("-"); return `${+dd} ${MONTHS_GEN[+m - 1]}`; };
const weekStart = d => addDays(d, -((wdOf(d) + 6) % 7));
const autoSince = () => Object.keys(db.plan.timed).filter(d => db.plan.timed[d] > 0).sort()[0] || null;
function setVal(d, id, v) {
  const e = db.plan.days[d] || (db.plan.days[d] = {});
  if (v === undefined) delete e[id]; else e[id] = v;
  if (!Object.keys(e).length) delete db.plan.days[d];
  if (!db.plan.start) db.plan.start = Object.keys(db.plan.days).sort()[0] || d;
  saveDB();
}
const cellText = (a, v) => v === undefined ? "—"
  : a.type === "check" ? (v ? "✓" : "✗")
  : a.type === "blocks" || a.type === "minutes" ? `${v} мин` : esc(v);

// итог недели одной строкой
function weekSummary(ws, upto) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i)).filter(d => d <= upto);
  const filled = days.filter(dayFilled);
  const parts = visibleActs().map(a => {

    if (a.rest) return `тренировок ${vals.filter(v => v && v !== a.rest).length}`;

function planTableHTML(t) {

}

// ---------- перенос из Obsidian ----------
// строка «День N: часть | часть | …»; часть узнаётся по названию дела, а минуты без названия — учебные блоки
function parseObsidian(text, start) {
  const acts = db.plan.acts, out = {}, skipped = [];
  const byWord = part => acts.find(a => norm(part).includes(norm(a.name).split(" ")[0]));
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const ln = raw.trim();
    if (!ln) continue;
    const m = ln.match(/^день\s+(\d+)\s*:\s*(.*)$/i);
    if (!m) { skipped.push(ln); continue; }
    const d = addDays(start, +m[1] - 1), e = {};
    for (const part of m[2].split("|").map(x => x.trim()).filter(Boolean)) {
      let a = byWord(part);
      if (!a && /\d+\s*м|блок/i.test(part)) a = acts.find(x => x.type === "blocks");
      if (!a) continue;
      if (a.type === "check") e[a.id] = !/✗|нет|-\s*$/i.test(part) && /✓|✔|\+|да/i.test(part);
      else if (a.type === "minutes") { const n = part.match(/(\d+)/); if (n) e[a.id] = +n[1]; }
      else if (a.type === "blocks") {
        const mins = [...part.matchAll(/(\d+)\s*м/gi)].reduce((s, x) => s + +x[1], 0);
        const bl = part.match(/(\d+)\s*блок/i);
        e[a.id] = mins || (bl ? +bl[1] * (a.blockMin || 50) : 0);
      } else {
        const o = (part.match(/день\s+(\S+)/i) || part.match(/(\S+)\s*$/))[1];
        if (o) { if (!(a.options || (a.options = [])).includes(o)) a.options.push(o); e[a.id] = o; }
      }
    }
    out[d] = e;
  }
  return { days: out, skipped };
}
function importObsidian(text, start) {
  const r = parseObsidian(text, start), n = Object.keys(r.days).length;
  if (!n) { toast("Не нашёл ни одной строки «День N: …»."); return; }
  Object.assign(db.plan.days, r.days);
  if (!db.plan.start || start < db.plan.start) db.plan.start = start;
  db.plan.seeded = true;
  saveDB(); planMode = "main"; render();
  toast(`Перенесено дней: ${n}${r.skipped.length ? `, пропущено строк: ${r.skipped.length}` : ""}.`);
}

// ---------- события плана ----------
document.body.addEventListener("click", e => {
  const row = e.target.closest("[data-plan-sel]");
  const b = e.target.closest("button");
  if (row && !b) { planSel = row.dataset.planSel || null; render(); window.scrollTo(0, 0); return; }
  if (!b) return;
  const d = b.dataset;
  if (d.planSel !== undefined) { planSel = d.planSel || null; render(); return; }
  if (d.planMore) { planShow += 14; render(); return; }
  if (d.planMode) { planMode = d.planMode; render(); window.scrollTo(0, 0); return; }
  if (d.planExport) { exportPlanOnly(); return; }
  if (d.obImport) { importObsidian(($("ob-text") || {}).value || "", ($("ob-start") || {}).value || todayISO()); return; }
  if (d.pvToggle) { const [id, day] = d.pvToggle.split("|"); setVal(day, id, !actValue(actById(id), day)); render(); return; }
  if (d.pvChoice) { const [id, day, o] = d.pvChoice.split("|"); setVal(day, id, actValue(actById(id), day) === o ? undefined : o); render(); return; }
  if (d.pvStep) {
    const [id, day, st] = d.pvStep.split("|"), a = actById(id), raw = (db.plan.days[day] || {})[id] || 0;
    const au = a.auto === "cards" ? autoMin(day) : 0;
    setVal(day, id, Math.max(-au, raw + +st)); render(); return;
  }
  if (d.paAdd) {
    const name = (($("pa-new") || {}).value || "").trim(), type = ($("pa-new-type") || {}).value;
    if (!name) return;
    db.plan.acts.push(Object.assign({ id: uid(), name, type }, type === "choice" ? { options: [] } : type === "blocks" ? { blockMin: 50 } : type === "minutes" ? { step: 10 } : {}));
    saveDB(); render(); toast(`Дело «${name}» добавлено.`); return;
  }
  if (d.paMove) { const [id, dir] = d.paMove.split("|"), A = db.plan.acts, i = A.findIndex(a => a.id === id), j = i + +dir;
    if (j >= 0 && j < A.length) { [A[i], A[j]] = [A[j], A[i]]; saveDB(); render(); } return; }
  if (d.paHide) { const a = actById(d.paHide); a.hidden = !a.hidden; saveDB(); render(); return; }
  if (d.paDel) {
    const a = actById(d.paDel);
    askConfirm(`Удалить дело «${a.name}» вместе с его данными за все дни? Чтобы данные сохранились, лучше скрыть дело.`, "Удалить", () => {
      db.plan.acts = db.plan.acts.filter(x => x.id !== a.id);
      for (const [day, ent] of Object.entries(db.plan.days)) { delete ent[a.id]; if (!Object.keys(ent).length) delete db.plan.days[day]; }
      saveDB(); render(); toast("Дело удалено.");
    });
    return;
  }
});
document.body.addEventListener("change", e => {

    const [id, day] = d.pvMin.split("|"), a = actById(id), n = el.value === "" ? undefined : Math.max(0, Math.round(+el.value));

  }

  if (d.paOpts) { const a = actById(d.paOpts); a.options = uniq(el.value.split(/[,;]/).map(x => x.trim()).filter(Boolean)); if (!a.options.includes(a.rest)) a.rest = ""; saveDB(); render(); return; }

      <div><span class="dot-l" style="background:var(--accent)"></span>среднее за 7 дней</div><div><span class="dot-l" style="background:var(--warning)"></span>не заполнен</div></div></div>`;

const validOldItems = d => Array.isArray(d) && d.every(x => x && typeof x === "object" &&

function classifyImport(data) {

  if (data.version === 2 && Array.isArray(data.records)) return { base: data, plan: data.plan || null };
  if (validOldItems(data)) return { base: migrateOld({ items: data, mats: [], stats: null }), old: true };
  if (validOldItems(data.items))

async function importData(input) {

    for (const file of list) {
      const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf);
      const zip = u8[0] === 0x50 && u8[1] === 0x4B;
      const files = zip ? await readZip(buf) : [{ name: file.name, text: new TextDecoder().decode(u8) }];
      for (const f of files) {
        if (zip && !/\.json$/i.test(f.name)) continue;
        let data;
        try { data = JSON.parse(f.text); } catch { if (!zip) throw new Error(`«${file.name}» — не корректный JSON`); continue; }
        const r = classifyImport(data);
        if (r.base) { base = r.base; old = old || !!r.old; }
        if (r.plan) plan = r.plan;
        if (r.photos) pics = r.photos;
      }
    }
  } catch (e) { toast(`Не удалось прочитать файл: ${e.message || e}.`); return; }
  if (!base && !plan && pics) {
    const n = matchPhotos(pics, db.people).length;
    if (!n) { toast("В файле фото, но ни одно не подходит к теоретикам текущей базы."); return; }
    askConfirm(`Поставить фото из файла: ${n} ${plural(n, ["теоретику", "теоретикам", "теоретикам"])}? Совпавшие фото заменятся.`, "Поставить",
      async () => { await importPhotos(pics, false); render(); toast(`Фото поставлены: ${n}.`); }, false);
    return;
  }
  if (!base && !plan) { toast("Файл не похож на выгрузку этого приложения — импорт отменён."); return; }
  const nDays = p => Object.keys((p && p.days) || {}).length;
  const R = n => `${n} ${plural(n, ["запись", "записи", "записей"])}`, D = n => `${n} ${plural(n, ["день", "дня", "дней"])}`;
  // фото едут вместе с базой: старые стираются, новые ставятся теоретикам загруженной базы
  const applyBase = () => { setDB(Object.assign({}, base, { plan: db.plan })); importPhotos(pics || [], true).then(() => render()); };
  const applyPlan = () => { db.plan = fixPlan(plan); dbVersion++; };
  const finish = msg => { session = null; editor = null; addPanel = null; nav = [{ kind: "grid" }]; planSel = null; saveDB(); render(); toast(msg); };
  const oldNote = old ? " Это выгрузка прежней версии — она будет перенесена в новый формат." : "";
  const curB = db.records.length, curP = nDays(db.plan);
  if (base && plan) {
    ask(`В файле: база — ${R(base.records.length)}, дневник — ${D(nDays(plan))}.${oldNote}\nСейчас: ${R(curB)} и ${D(curP)}. Заменённое пропадёт.`, [
      { label: "Отмена" },
      { label: "Только базу", cls: "btn-outline", fn: () => { applyBase(); finish(`Импортирована база: ${R(db.records.length)}.`); } },
      { label: "Только дневник", cls: "btn-outline", fn: () => { applyPlan(); finish(`Импортирован дневник: ${D(nDays(db.plan))}.`); } },
      { label: "Заменить оба", cls: "btn-danger", fn: () => { applyBase(); applyPlan(); finish(`Импортированы база (${R(db.records.length)}) и дневник (${D(nDays(db.plan))}).`); } }]);
  } else if (base) {

                    : `Загрузить из файла ${R(base.records.length)}?${oldNote}`,
      curB ? "Заменить" : "Загрузить", () => { applyBase(); finish(`Импортировано: ${R(db.records.length)}.`); }, !!curB);
  } else {
    askConfirm(curP ? `Загрузить дневник из файла (${D(nDays(plan))}) и заменить текущий (${D(curP)})? База не тронется.`

// =====================================================================
//  Таймеры и плеер наград
// =====================================================================
// Таймер блока — обычный отсчёт по часам, со страницы уходить можно; в конце минуты идут в «Учебные блоки».
// Таймер повторений — отсчёт до следующей награды по времени ответов: идёт, только пока отвечаешь,
// а уход на другую вкладку записывается как отвлечение. Каждые N минут ответов (по умолчанию 10) — одна награда,
// за награду в плеере можно включить один ролик или песню целиком.
const tset = () => db.plan.timerSettings;
const perReward = () => tset().rep * 60;
const repMinAcc = () => `${tset().rep} ${plural(tset().rep, ["минуту", "минуты", "минут"])}`;     // «за 10 минут»
const repMinNom = () => `${tset().rep} ${plural(tset().rep, ["минута", "минуты", "минут"])}`;     // «10 минут повторения»
let timerTick = null, awayAt = null, audioCtx = null;
const baseTitle = document.title;

function beep(times = 3) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + i * 0.35;
      o.frequency.value = 880; g.gain.setValueAtTime(0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.3);
    }
  } catch {}
}
function notify(title, body) {
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body }); } catch {}
}
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };

// ---------- награды: копятся от времени ответов ----------
function addRewardTime(sec) {
  const rw = db.plan.rewards;
  rw.progress += sec;
  while (rw.progress >= perReward()) {
    rw.progress -= perReward(); rw.balance++; rw.earned++;
    beep(2); toast(`+1 награда за ${repMinAcc()} повторения. Наград: ${rw.balance}.`);
    notify("Награда", `${repMinNom()} повторения — можно включить ролик. Наград: ${rw.balance}.`);
  }
}
// засечка ответов: время с прошлого действия; пауза дольше 2 минут и время на другой вкладке не считаются
function planTick() {
  if (!session) return;
  const now = Date.now(), sec = (now - (session.t || now)) / 1000;
  session.t = now;
  if (sec > 0 && sec <= 120 && appIsVisible()) {
    const d = todayISO();
    db.plan.timed[d] = (db.plan.timed[d] || 0) + sec;
    addRewardTime(sec);
  }
}

// ---------- запуск, пауза, остановка ----------
function blockLeft(t, now = Date.now()) {
  const paused = t.pausedMs + (t.pausedAt ? now - t.pausedAt : 0);
  return t.dur - (now - t.start - paused);
}
async function startTimer(kind) {
  const cur = db.plan.timer;
  if (cur) {
    const ok = await confirmAsync(`Уже идёт ${cur.kind === "block" ? "учебный блок" : "таймер повторений"}. Остановить его и начать новый?`, "Остановить");
    if (!ok) return;
    await stopTimer(true);
  }
  if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} }
  beep(0);   // разрешить звук по нажатию: без этого браузер может не дать пищать в конце
  db.plan.timer = kind === "block"
    ? { kind, start: Date.now(), dur: tset().block * 60000, pausedMs: 0, pausedAt: null }
    : { kind, start: Date.now(), dn: 0, dsec: 0, earned0: db.plan.rewards.earned };
  saveDB(); render();
  toast(kind === "block" ? `Блок на ${tset().block} минут пошёл. Со страницы можно уходить.` : "Таймер повторений пошёл: он идёт, пока ты отвечаешь.");
}
function pauseTimer() {
  const t = db.plan.timer;
  if (!t || t.kind !== "block") return;
  if (t.pausedAt) { t.pausedMs += Date.now() - t.pausedAt; t.pausedAt = null; } else t.pausedAt = Date.now();
  saveDB(); render();
}
function finishBlock(t, minutes, note) {
  const blk = db.plan.acts.find(a => a.type === "blocks" && !a.hidden) || db.plan.acts.find(a => a.type === "blocks");
  if (blk && minutes > 0) {
    const d = todayISO(), cur = (db.plan.days[d] || {})[blk.id] || 0;
    setVal(d, blk.id, cur + minutes);
  }
  db.plan.timer = null; saveDB(); render();
  toast(`${note}${blk && minutes > 0 ? ` +${minutes} мин к «${blk.name}».` : ""}`);
}
async function stopTimer(silent = false) {
  const t = db.plan.timer;
  if (!t) return;
  if (t.kind === "block") {
    const done = Math.floor((t.dur - blockLeft(t)) / 60000);
    if (silent || done < 1) { db.plan.timer = null; saveDB(); render(); return; }
    const v = await askAsync(`Остановить блок? Прошло ${done} мин из ${Math.round(t.dur / 60000)}.`, [
      { label: "Отмена", value: null }, { label: "Не засчитывать", cls: "btn-outline", value: "drop" },
      { label: `Засчитать ${done} мин`, cls: "btn-primary", value: "keep" }]);
    if (!v) return;
    finishBlock(t, v === "keep" ? done : 0, "Блок остановлен.");
  } else {
    const got = db.plan.rewards.earned - t.earned0;
    db.plan.timer = null; saveDB(); render();
    if (!silent) toast(`Таймер повторений остановлен. Наград за него: ${got}. Отвлекался: ${t.dn} ${plural(t.dn, ["раз", "раза", "раз"])}${t.dn ? `, ${Math.round(t.dsec / 60)} мин` : ""}.`);
  }
}
// раз в секунду: полоска, заголовок вкладки, конец блока (в том числе если он кончился, пока приложение было закрыто)
function timerLoop() {
  const t = db.plan.timer;
  if (t && t.kind === "block" && blockLeft(t) <= 0) {
    const mins = Math.round(t.dur / 60000), late = -blockLeft(t);
    beep(3); notify("Блок закончен", `${mins} минут — время отдохнуть.`);
    finishBlock(t, mins, late > 120000 ? `Блок закончился, пока приложение было закрыто.` : "Блок закончен!");
    return;
  }
  if (appIsVisible()) renderTimerBar();
}
function renderTimerBar() {
  const el = $("timerbar"), t = db.plan.timer;
  if (!el) return;
  if (!t) { el.classList.add("hidden"); document.title = baseTitle; return; }
  el.classList.remove("hidden");
  if (t.kind === "block") {
    const left = blockLeft(t), frac = 1 - left / t.dur;
    el.innerHTML = `<div class="tb-main"><span class="tb-kind">Учебный блок</span><span class="tb-time">${mmss(left / 1000)}</span>
        <span class="hint">${t.pausedAt ? "на паузе" : "можно уходить со страницы"}</span><span style="flex:1"></span>

  if (imgs.length) {
    if (pid) await setPhoto(pid, imgs[0]);
    else toast("Картинка ставится фото теоретика: открой его страницу и перетащи её туда.");
  }
  if (texts.length) {
    const parts = await Promise.all(texts.map(f => f.text()));
    const text = parts.map(t => t.replace(/^﻿/, "").trim()).filter(Boolean).join("\n\n");
    if (text) {
      if (editor && $("ed-text")) {
        const ta = $("ed-text"), at = ta.selectionStart ?? ta.value.length;
        ta.value = ta.value.slice(0, at) + (at && !ta.value.slice(0, at).endsWith("\n") ? "\n" : "") + text + ta.value.slice(at);
        editor.text = ta.value; ta.focus(); updateCounter();
        toast("Текст вставлен в редактор.");
      } else {
        clearSearch();
        openAddPanel("full");
        const cur = (addPanel.text.full || "").trim();
        addPanel.text.full = cur ? cur + "\n\n" + text : text;
        addPanel.error = null;
        render();
        toast(`Текст из ${texts.length === 1 ? `«${texts[0].name}»` : `${texts.length} файлов`} — в «Готовых записях». Проверь и нажми «Добавить».`);
      }
    }
  }
  if (media.length) { activeTab = "player"; clearSearch(); render(); if (mediaList === null) await loadMedia(); await addMedia(media); }
  if (data.length) await importData(data);
}

// ---------- старт ----------
const startMsg = loadDB();
activeTab = db.records.some(r => topicDue(r, todayISO()) || dueQs(r, todayISO()).length) ? "rep" : (db.records.length ? "base" : "rep");
render();
if (startMsg) toast(startMsg);
setInterval(timerLoop, 1000); timerLoop();
loadPhotos();

// =====================================================================
//  Внутри Хаба: карточка на «Сегодня» и приём элементов из корзины.
//  Без хаба (файл открыт прямо в браузере) этот блок ничего не делает.
// =====================================================================
if (window.hub) {
  hub.on("app.files", files => { hideDrop(); handleDrop({ files }, "files").catch(reportDropError); });
  const plural = (n, f) => { const a = n % 10, b = n % 100; return `${n} ${a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]}`; };
  let cardVersion = -1, cardDay;
  const hubCard = () => {
    const t = todayISO();
    if (cardVersion === dbVersion && cardDay === t) return;
    cardVersion = dbVersion; cardDay = t;
    const dc = dueCounts(t), mode = db.meta.settings.mode;
    const n = mode === "topics" ? dc.topics : dc.questions;
    const inRep = db.records.filter(r => activeQs(r).length).length;
    if (!inRep) {
      hub.today.set({ main: db.records.length ? "Нет вопросов к повторению" : "База пуста",
                      note: db.records.length ? `записей в базе: ${db.records.length}` : "добавьте первую запись", action: { label: "Открыть", open: "base" } });
      return;
    }
    if (!n) {
      const tomorrow = addDays(t, 1), dn = dueCounts(tomorrow), m = mode === "topics" ? dn.topics : dn.questions;
      hub.today.set({ main: "Всё повторено", note: m ? `завтра — ${plural(m, mode === "topics" ? ["тема", "темы", "тем"] : ["вопрос", "вопроса", "вопросов"])}` : "завтра ничего", done: true });
      return;
    }
    const ls = logSummary(), st = streakDays(logCountByDay());
    hub.today.set({
      main: mode === "topics" ? `${plural(n, ["тема", "темы", "тем"])} к повторению` : `${plural(n, ["вопрос", "вопроса", "вопросов"])} к повторению`,
      note: st ? `серия ${st} дн. · помню ${pct(ls.share)}%` : (ls.n ? `помню ${pct(ls.share)}%` : "первая сессия"),
      action: { label: "Начать", open: "rep" },
    });
  };
  // после каждой отрисовки и раз в 10 минут (новый день начинается в 4:00)
  const baseRender = render;
  render = function () { baseRender.apply(this, arguments); try { hubCard(); } catch (e) { console.error(e); } };
  hubCard();
  setInterval(hubCard, 10 * 60e3);

  // кнопка карточки на «Сегодня»
  hub.today.onAction(a => {
    clearSearch(); session = null; editor = null;
    activeTab = a && a.open === "base" ? "base" : "rep";
    render();
  });

  // элемент корзины → заготовка на стадии «услышал»: первая строка — название, остальное — конспект
  hub.inbox.onItem(item => {
    const lines = String(item.text || "").trim().split(/\r?\n/);
    let title = lines.shift().replace(/(^|\s)#[\p{L}\p{N}_-]+/gu, " ").replace(/\s+/g, " ").trim() || "Без названия";
    let body = lines.join("\n").trim();
    if (title.length > 120) { body = (title + (body ? "\n\n" + body : "")); title = title.slice(0, 80).replace(/\s+\S*$/, "") + "…"; }
    const t = todayISO();
    db.records.push(fixRecord({ title: cap(title), body, created: t, updated: t }));
    if (!saveDB()) return false;
    render();
    toast(`Из корзины: «${cap(title)}» — заготовка в «Базе».`);
  });
}
</script>
</body>
</html>
