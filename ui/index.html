<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хаб</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="hub/tokens.css">
<link rel="stylesheet" href="hub/hub.css">
<link rel="stylesheet" href="shell.css">
<script src="hub/hub-ui.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="hub-backdrop" data-scene="open" aria-hidden="true"><div class="hub-backdrop__photo"></div><div class="hub-backdrop__veil"></div></div>

<!-- Заголовок окна: в цвет темы, вместо системной белой полосы -->
<header class="shell-titlebar" id="titlebar" data-tauri-drag-region>
  <span class="shell-titlebar__name" data-tauri-drag-region><img class="shell-brand" src="favicon.svg" alt="" width="18" height="18">Хаб<span id="titlebar-place"></span></span>
  <span class="shell-titlebar__toggles" id="titlebar-toggles">
    <button class="shell-titlebar__text" type="button" data-panel="rail" aria-pressed="false" title="Боковая панель приложений">Панель</button>
    <button class="shell-titlebar__text" type="button" data-panel="top" aria-pressed="false" title="Строка ввода сверху · Ctrl+Пробел">Строка ввода</button>
  </span>
  <span class="shell-titlebar__fill" data-tauri-drag-region></span>
  <span class="shell-titlebar__tools" id="titlebar-tools"><span id="titlebar-sync"></span>
    <button class="shell-titlebar__btn" type="button" data-go="lock" aria-label="Заблокировать" title="Заблокировать · Ctrl+L"><i data-icon="lock"></i></button></span>
  <span class="shell-titlebar__win" id="titlebar-win">
    <button class="shell-titlebar__btn" type="button" data-win="min" aria-label="Свернуть" title="Свернуть"><i data-icon="minus"></i></button>
    <button class="shell-titlebar__btn" type="button" data-win="max" aria-label="Развернуть" title="Развернуть"><svg class="hub-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"/></svg></button>
    <button class="shell-titlebar__btn shell-titlebar__btn--close" type="button" data-win="close" aria-label="Закрыть" title="Закрыть"><i data-icon="x"></i></button>
  </span>
</header>

<!-- «Сегодня» -->
<div class="hub-today" id="screen-today" hidden>
  <header class="hub-topbar">
    <div><span class="hub-topbar__hello" id="today-hello">Добрый день</span> · <span id="today-date"></span></div>
    <div class="hub-topbar__right">
      <span id="today-sync"></span>
      <span class="hub-row__trail shell-hint-keys"><kbd class="hub-kbd">Alt</kbd><kbd class="hub-kbd">1…9</kbd> приложения</span>
      <button class="hub-btn hub-btn--sm hub-btn--glass hub-btn--icon shell-desktop" type="button" data-go="settings" aria-label="Настройки" title="Настройки"><i data-icon="settings"></i></button>
      <button class="hub-btn hub-btn--sm hub-btn--glass shell-desktop" type="button" data-go="lock" title="Ctrl+L"><i data-icon="lock"></i>Заблокировать</button>
    </div>
  </header>
  <div class="shell-capture-wrap">
    <form class="hub-capture" id="capture-main" autocomplete="off">
      <div class="hub-capture__bar">
        <i data-icon="lightbulb" class="hub-capture__icon"></i>
        <input class="hub-capture__input" placeholder="Мысль в корзину…" aria-label="Мысль в корзину" maxlength="4000">
        <button class="hub-capture__send" type="submit" disabled>В корзину</button>
      </div>
      <p class="hub-capture__note" aria-live="polite"></p>
    </form>
  </div>
  <p class="hub-today__note" id="today-note" hidden></p>
  <section class="hub-cards shell-cards" id="today-cards" aria-label="Приложения"></section>
</div>

<!-- Разбор корзины -->
<div class="hub-today" id="screen-triage" hidden>
  <header class="hub-topbar">
    <div><span class="hub-topbar__hello" id="triage-hello">Добрый день</span> · <span id="triage-date"></span></div>
    <div class="hub-topbar__right">
      <button class="hub-btn hub-btn--sm hub-btn--glass" type="button" data-go="today"><i data-icon="house"></i>«Сегодня» <kbd class="hub-kbd">Esc</kbd></button>
    </div>
  </header>
  <div class="hub-triage shell-triage" id="triage"></div>
</div>

<!-- Телефон: все приложения -->
<div class="hub-today shell-apps" id="screen-apps" hidden>
  <header class="hub-appbar"><h1 class="hub-appbar__title">Приложения</h1></header>
  <div class="shell-apps-grid" id="apps-grid"></div>
</div>

<div class="shell-lock" id="screen-lock" hidden></div>

<!-- Оболочка приложения -->
<div class="hub-shell" id="screen-shell" hidden>
  <header class="hub-appbar shell-appbar" id="appbar">
    <button class="hub-btn hub-btn--quiet hub-btn--icon" type="button" data-go="back" aria-label="Назад"><i data-icon="arrow-left"></i></button>
    <h1 class="hub-appbar__title" id="appbar-title"></h1>
    <span id="appbar-sync"></span>
  </header>
  <nav class="hub-rail hub-glass" id="rail" aria-label="Приложения"></nav>
  <header class="hub-shell__top">
    <form class="hub-capture hub-capture--compact" id="capture-compact" autocomplete="off">
      <div class="hub-capture__bar">
        <i data-icon="lightbulb" class="hub-capture__icon"></i>
        <input class="hub-capture__input" placeholder="Мысль в корзину…" aria-label="Мысль в корзину" maxlength="4000">
        <button class="hub-capture__send" type="submit" disabled>В корзину</button>
      </div>
      <p class="hub-capture__note" aria-live="polite"></p>
    </form>
    <div class="hub-topbar__right"><span id="shell-sync"></span>
      <button class="hub-btn hub-btn--sm hub-btn--glass hub-btn--icon" type="button" data-go="lock" aria-label="Заблокировать" title="Заблокировать · Ctrl+L"><i data-icon="lock"></i></button></div>
  </header>
  <main class="hub-shell__main hub-glass shell-main" id="shell-main">
    <div class="shell-frames" id="frames"></div>
    <section class="shell-page" id="settings" hidden></section>
  </main>
</div>

<nav class="hub-navbar shell-navbar" id="navbar" aria-label="Разделы"></nav>

<div class="hub-toasts" role="status" aria-live="polite"></div>
</body>
</html>
